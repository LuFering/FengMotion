<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="lightA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12100d"/>
      <stop offset="1" stop-color="#070606"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bgA)"/>
  <!-- 卷帘门 -->
  <rect x="120" y="0" width="560" height="260" fill="#171512"/>
  <g stroke="#2a2620" stroke-width="6">
    <line x1="120" y1="40" x2="680" y2="40"/><line x1="120" y1="80" x2="680" y2="80"/>
    <line x1="120" y1="120" x2="680" y2="120"/><line x1="120" y1="160" x2="680" y2="160"/>
    <line x1="120" y1="200" x2="680" y2="200"/><line x1="120" y1="240" x2="680" y2="240"/>
  </g>
  <!-- 窗与光 -->
  <rect x="1040" y="90" width="430" height="600" fill="#241b12" stroke="#3a2d1e" stroke-width="8"/>
  <rect x="1062" y="112" width="386" height="556" fill="#4a3724"/>
  <polygon points="1062,112 1448,668 1448,668 1062,668" fill="url(#lightA)" opacity="0.5"/>
  <polygon points="1062,180 900,760 900,760 1448,760 1448,180" fill="#ffd9a0" opacity="0.10"/>
  <!-- 吧台 -->
  <rect x="0" y="700" width="1600" height="200" fill="#15120e"/>
  <rect x="0" y="700" width="1600" height="8" fill="#3a2f22"/>
  <!-- 光在吧台上的落点 -->
  <polygon points="980,700 1460,700 1300,900 820,900" fill="#ffd9a0" opacity="0.13"/>
  <text x="120" y="760" font-family="'Noto Serif CJK SC', serif" font-size="56" fill="#f2e7d3" letter-spacing="6">A · 连续空间</text>
  <text x="120" y="816" font-family="'Noto Sans CJK SC', sans-serif" font-size="26" fill="#b9ad9a" letter-spacing="3">L1：光先进入，人物尚未成为焦点</text>
  <text x="120" y="860" font-family="'Noto Sans CJK SC', sans-serif" font-size="20" fill="#7d7365" letter-spacing="2">方向样稿 · 设计示意，非最终关键帧 / placeholder assets</text>
</svg>
