<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FengMotion · 首页重构预览（时间轴）</title>
<style>
:root{
  --bg:#0B0B0C; --panel:#111214; --line:#24262B; --line-2:#1A1C20;
  --fg:#F0EDE6; --dim:#8E9198; --faint:#5E6167;
  --acc:#3B8CF8; --play:#FF5A36;
  --serif:"Noto Serif CJK SC","思源宋体",Songti SC,serif;
  --sans:"Noto Sans CJK SC","思源黑体",system-ui,sans-serif;
  --mono:"Noto Sans Mono CJK SC",ui-monospace,"SF Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  -webkit-font-smoothing:antialiased}
.page{width:1440px;margin:0 auto;padding:0 56px 40px}

/* ── 顶栏 ─────────────────────────────────────────── */
.bar{display:flex;align-items:center;gap:16px;height:58px;border-bottom:1px solid var(--line-2)}
.bar img{height:19px;width:auto;display:block;opacity:.95}
.bar .st{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
.bar .st b{color:var(--fg);font-weight:500}
.bar .dot{width:5px;height:5px;border-radius:50%;background:#3FBF8F}
.bar .sep{width:1px;height:11px;background:var(--line)}
.bar .go{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:32px;
  padding:0 13px;border:1px solid var(--line);border-radius:999px;background:0 0;
  color:var(--fg);font:12px var(--sans);cursor:pointer;transition:.15s}
.bar .go:hover{border-color:var(--acc);color:#fff;background:#3B8CF814}

/* ── 标题区 ───────────────────────────────────────── */
.head{display:flex;align-items:flex-end;gap:20px;padding:34px 0 18px}
.head h1{margin:0;font:600 44px/1.1 var(--serif);letter-spacing:-.01em}
.head .meta{display:flex;gap:9px;align-items:center;margin-left:auto;
  font:11.5px var(--mono);color:var(--dim);padding-bottom:6px}
.head .meta b{color:var(--fg);font-weight:400}
.head .meta .sep{width:1px;height:10px;background:var(--line)}

/* ── 时间轴 ───────────────────────────────────────── */
.ribbon{position:relative;margin-top:6px}
.rail{position:relative;display:flex;gap:2px;height:168px;border-radius:3px;overflow:hidden;
  background:var(--panel);outline:1px solid var(--line-2);outline-offset:-1px}
.seg{position:relative;flex:1 1 0;min-width:0;padding:0;border:0;background:#0E0F11;
  cursor:pointer;overflow:hidden;isolation:isolate}
.seg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  filter:brightness(.62) saturate(.85);transition:filter .35s,transform .5s cubic-bezier(.2,.7,.2,1)}
.seg:hover img{filter:brightness(.95) saturate(1);transform:scale(1.04)}
.seg-o{position:absolute;inset:0;background:linear-gradient(transparent 45%,#000000a8);
  transition:opacity .3s}
.seg-l{position:absolute;left:5px;right:5px;bottom:20px;font:10.5px/1.3 var(--sans);
  color:#fff;text-align:left;opacity:0;transform:translateY(3px);transition:.25s;
  text-shadow:0 1px 4px #000}
.seg:hover .seg-l{opacity:1;transform:none}
.seg-t{position:absolute;left:5px;bottom:5px;font:9.5px var(--mono);color:#ffffffa8}
.seg.on{box-shadow:inset 0 0 0 2px var(--acc);z-index:2}
.seg.on img{filter:brightness(.92) saturate(1)}
.seg.on .seg-l{opacity:1;transform:none}

/* 待出片 */
.pending{position:relative;flex:0 0 92px;background:
  repeating-linear-gradient(135deg,#15171A 0 6px,#0E0F11 6px 12px);
  display:flex;align-items:flex-end;padding:6px;cursor:default}
.pending span{font:9.5px var(--mono);color:var(--faint);line-height:1.4}

/* 播放头 */
.play{position:absolute;top:-10px;bottom:26px;left:30.000%;width:1px;background:var(--play);
  z-index:3;pointer-events:none}
.play::before{content:"";position:absolute;top:-1px;left:-4px;width:9px;height:9px;
  background:var(--play);border-radius:2px 2px 6px 6px}
.play b{position:absolute;top:-24px;left:-19px;font:10px var(--mono);color:#0B0B0C;
  background:var(--play);padding:2px 5px;border-radius:3px;white-space:nowrap}

/* 刻度 */
.ruler{position:relative;height:26px;margin-top:6px}
.ruler i{position:absolute;top:0;height:5px;width:1px;background:var(--line)}
.ruler i b{position:absolute;top:6px;left:-14px;font:9.5px var(--mono);color:var(--faint);
  font-style:normal;white-space:nowrap}

/* 当前镜头说明 */
.cap{display:flex;align-items:center;gap:12px;margin-top:10px;min-height:22px}
.cap .id{font:10.5px var(--mono);color:var(--faint);letter-spacing:.06em}
.cap b{font-size:14px;font-weight:500}
.cap span{font:11px var(--mono);color:var(--dim)}
.cap a{margin-left:auto;font-size:12px;color:var(--dim);text-decoration:none;
  border-bottom:1px solid var(--line);padding-bottom:1px}
.cap a:hover{color:var(--fg);border-color:var(--dim)}

/* ── 下半：新片 + 接着看 ──────────────────────────── */
.lower{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:52px;
  margin-top:34px;padding-top:28px;border-top:1px solid var(--line-2)}
.lbl{font-size:11px;color:var(--faint);letter-spacing:.04em;margin-bottom:14px}
.make input{width:100%;border:0;border-bottom:1px solid var(--line);background:0 0;
  color:var(--fg);font:400 21px/1.5 var(--serif);padding:4px 0 12px;outline:0;
  transition:border-color .2s}
.make input::placeholder{color:var(--faint)}
.make input:focus{border-color:var(--acc)}
.make .row{display:flex;align-items:center;gap:18px;margin-top:14px}
.make .pre{display:flex;gap:18px;font-size:12.5px;color:var(--dim)}
.make .pre button{border:0;background:0 0;padding:0 0 3px;color:inherit;font:inherit;
  cursor:pointer;border-bottom:1px solid transparent}
.make .pre button:hover{color:var(--fg)}
.make .pre button.on{color:var(--fg);border-bottom-color:var(--acc)}
.make .start{margin-left:auto;display:inline-flex;align-items:center;gap:9px;height:40px;
  padding:0 18px;border:0;border-radius:3px;background:var(--acc);color:#fff;
  font:500 13px var(--sans);cursor:pointer;transition:.15s}
.make .start:hover{background:#2E6FD9}
.make .start:disabled{background:var(--panel);color:var(--faint);cursor:not-allowed}

.watch{display:flex;flex-direction:column;gap:9px}
.watch a{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;
  padding:6px 0;border-bottom:1px solid var(--line-2);transition:.15s}
.watch a:hover{border-color:var(--line)}
.watch a:last-child{border-bottom:0}
.watch img{width:64px;height:36px;object-fit:cover;border-radius:2px;flex:0 0 auto;
  filter:brightness(.8);transition:.2s}
.watch a:hover img{filter:brightness(1)}
.watch .t{min-width:0}
.watch .t b{display:block;font-size:12.5px;font-weight:500;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.watch .t span{font:10px var(--mono);color:var(--faint)}

/* ── 底部索引：一行，不做卡片 ─────────────────────── */
.ledger{display:flex;align-items:center;gap:0;margin-top:34px;padding-top:16px;
  border-top:1px solid var(--line-2)}
.ledger a{display:flex;align-items:baseline;gap:9px;padding:4px 26px 4px 0;margin-right:26px;
  border-right:1px solid var(--line-2);text-decoration:none;color:var(--dim);font-size:12.5px}
.ledger a:last-child{border-right:0;margin-right:0}
.ledger a b{font:400 19px var(--mono);color:var(--fg)}
.ledger a i{font-style:normal;font:10.5px var(--mono);color:var(--faint)}
.ledger a:hover{color:var(--fg)}
.ledger a:hover b{color:var(--acc)}
.ledger .note{margin-left:auto;font:10.5px var(--mono);color:var(--faint)}
</style>
</head>

ng="lazy"><span class="seg-o"></span><span class="seg-l">两种计费</span><span class="seg-t">1:34</span></button><button class="seg" data-id="s17" data-name="一头算力 一头生产力" data-start="102.4" data-dur="7.6" style="flex:7.600 1 0"><img src="/frames/u17.jpg" alt="" loading="lazy"><span class="seg-o"></span><span class="seg-l">一头算力 一头生产力</span><span class="seg-t">1:42</span></button><button class="seg" data-id="s18" data-name="循环转起来" data-start="110.0" data-dur="8.0" style="flex:8.000 1 0"><img src="/frames/u18.jpg" alt="" loading="lazy"><span class="seg-o"></span><span class="seg-l">循环转起来</span><span class="seg-t">1:50</span></button><button class="seg" data-id="s19" data-name="薅" data-start="118.0" data-dur="6.4" style="flex:6.400 1 0"><img src="/frames/u19.jpg" alt="" loading="lazy"><span class="seg-o"></span><span class="seg-l">薅</span><span class="seg-t">1:58</span></button><button class="seg" data-id="s20" data-name="三块钱" data-start="124.4" data-dur="6.6" style="flex:6.600 1 0"><img src="/frames/u20.jpg" alt="" loading="lazy"><span class="seg-o"></span><span class="seg-l">三块钱</span><span class="seg-t">2:04</span></button><button class="seg" data-id="s21" data-name="那是多少" data-start="131.0" data-dur="7.2" style="flex:7.200 1 0"><img src="/frames/u21.jpg" alt="" loading="lazy"><span class="seg-o"></span><span class="seg-l">那是多少</span><span class="seg-t">2:11</span></button><button class="seg" data-id="s22" data-name="免费额度" data-start="138.2" data-dur="7.0" style="flex:7.000 1 0"><img src="/frames/u22.jpg" alt="" loading="lazy"><span class="seg-o"></span><span class="seg-l">免费额度</span><span class="seg-t">2:18</span></button><button class="seg" data-id="s23" data-name="收" data-start="145.2" data-dur="6.8" style="flex:6.800 1 0"><img src="/frames/u23.jpg" alt="" loading="lazy"><span class="seg-o"></span><span class="seg-l">收</span><span class="seg-t">2:25</span></button>

<script>
(function () {
  const segs = [...document.querySelectorAll('.seg')];
  const rail = document.querySelector('.rail');
  const play = document.getElementById('play');
  const playT = document.getElementById('playT');
  const capId = document.getElementById('capId');
  const capName = document.getElementById('capName');
  const capTc = document.getElementById('capTc');
  const TOTAL = 152.0;
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

  function select(el) {
    segs.forEach(s => s.classList.toggle('on', s === el));
    const start = parseFloat(el.dataset.start);
    const dur = parseFloat(el.dataset.dur);
    play.style.left = (start / TOTAL * 100) + '%';
    playT.textContent = fmt(start);
    capId.textContent = el.dataset.id.toUpperCase();
    capName.textContent = el.dataset.name;
    capTc.textContent = fmt(start) + '–' + fmt(start + dur) + ' · 中景 · 口播科普';
  }

  segs.forEach(el => {
    el.addEventListener('click', () => select(el));
    el.addEventListener('mouseenter', () => {
      play.style.left = (parseFloat(el.dataset.start) / TOTAL * 100) + '%';
      playT.textContent = fmt(parseFloat(el.dataset.start));
    });
  });
  rail.addEventListener('mouseleave', () => {
    const cur = document.querySelector('.seg.on');
    if (cur) {
      play.style.left = (parseFloat(cur.dataset.start) / TOTAL * 100) + '%';
      playT.textContent = fmt(parseFloat(cur.dataset.start));
    }
  });

  const idea = document.getElementById('idea');
  const start = document.getElementById('start');
  const sync = () => { start.disabled = !idea.value.trim(); };
  idea.addEventListener('input', sync);
  sync();
  document.querySelectorAll('.pre button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.pre button').forEach(x => x.classList.toggle('on', x === b));
    });
  });
  select(document.querySelector('.seg[data-id="s09"]'));
})();
</script>
</body>
</html>
