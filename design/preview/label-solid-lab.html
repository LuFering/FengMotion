<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>实心蓝标 · 六种创意框</title>
<style>
:root{--blue:#3B8CF8;
  --serif:"Noto Serif CJK SC","思源宋体",Songti SC,serif;
  --mono:"Noto Sans Mono CJK SC",ui-monospace,monospace;
  --sans:"Noto Sans CJK SC","思源黑体",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;width:1440px;background:#000;color:#F4F1EA;font-family:var(--sans);
  -webkit-font-smoothing:antialiased}
.row{padding:30px 56px 38px}
.row .tag{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
.row .tag b{font:400 10px var(--mono);letter-spacing:.3em;color:var(--blue)}
.row .tag span{font:400 11px var(--mono);letter-spacing:.12em;color:#6E6E6E}
.band{position:relative;height:248px;overflow:hidden;background:#050505;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.band video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:brightness(.72) saturate(.92)}
.band .scrim{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(to top,rgba(0,0,0,.8) 0%,rgba(0,0,0,.35) 34%,transparent 62%),
             linear-gradient(to right,rgba(0,0,0,.45),transparent 44%)}
.wrap{position:absolute;left:22px;bottom:18px;z-index:2;display:flex;flex-direction:column;gap:9px}
.tc{display:flex;align-items:center;gap:7px;font:9.5px var(--mono);letter-spacing:.16em;
  color:#B4B4B4;font-variant-numeric:tabular-nums}
.tc i{width:5px;height:5px;border-radius:50%;background:#F0553F;box-shadow:0 0 8px #F0553F}

/* A 书签旗标：右端切一个缺口 */
.tab-a{display:inline-flex;align-items:center;height:30px;padding:0 26px 0 14px;
  background:var(--blue);color:#fff;font:500 11.5px var(--mono);letter-spacing:.18em;
  clip-path:polygon(0 0,100% 0,calc(100% - 11px) 50%,100% 100%,0 100%)}

/* B 斜切条 */
.tab-b{display:inline-flex;align-items:center;height:30px;padding:0 18px;
  background:var(--blue);color:#fff;font:500 11.5px var(--mono);letter-spacing:.18em;
  transform:skewX(-11deg)}
.tab-b span{display:inline-block;transform:skewX(11deg)}

/* C 齿孔条：左侧一排孔 */
.tab-c{position:relative;display:inline-flex;align-items:center;height:30px;padding:0 16px 0 26px;
  background:var(--blue);color:#fff;font:500 11.5px var(--mono);letter-spacing:.18em}
.tab-c::before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:9px;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.62) 0 5px,transparent 5px 10px)}

/* D 贴纸：轻微旋转 + 硬投影 */
.tab-d{display:inline-flex;align-items:center;height:30px;padding:0 15px;
  background:var(--blue);color:#fff;font:500 11.5px var(--mono);letter-spacing:.18em;
  transform:rotate(-2.2deg);box-shadow:5px 5px 0 rgba(0,0,0,.55)}

/* E 下三分之一条：编号块 + 名称 + 顶部细白线 */
.tab-e{display:inline-flex;align-items:stretch;height:32px;background:var(--blue);
  box-shadow:0 -1px 0 rgba(255,255,255,.85)}
.tab-e b{display:flex;align-items:center;padding:0 9px;background:rgba(0,0,0,.22);
  color:#fff;font:500 10px var(--mono);letter-spacing:.12em}
.tab-e span{display:flex;align-items:center;padding:0 16px 0 13px;color:#fff;
  font:500 11.5px var(--mono);letter-spacing:.18em}

/* F 套版叠块：实心块 + 背后错位细框 */
.tab-f{position:relative;display:inline-flex;align-items:center;height:30px;padding:0 16px;
  background:var(--blue);color:#fff;font:500 11.5px var(--mono);letter-spacing:.18em}
.tab-f::after{content:"";position:absolute;inset:0;transform:translate(7px,7px);
  border:1px solid rgba(255,255,255,.55);z-index:-1}
</style>
</head>
<body>

<div class="row">
  <div class="tag"><b>方案 A</b><span>书签旗标 · 右端切一个缺口，像夹在片子里的书签</span></div>
  <div class="band">
    <video src="assets/hero-cards.mp4" autoplay muted loop playsinline></video>
    <span class="scrim"></span>
    <div class="wrap"><div class="tc"><i></i>00:00:12:04</div>
      <div><span class="tab-a">口播科普</span></div></div>
  </div>
</div>

<div class="row">
  <div class="tag"><b>方案 B</b><span>斜切条 · 整条斜 11°，像场记板上的手写条</span></div>
  <div class="band">
    <video src="assets/hero-cards.mp4" autoplay muted loop playsinline></video>
    <span class="scrim"></span>
    <div class="wrap"><div class="tc"><i></i>00:00:12:04</div>
      <div><span class="tab-b"><span>口播科普</span></span></div></div>
  </div>
</div>

<div class="row">
  <div class="tag"><b>方案 C</b><span>齿孔条 · 左边一排孔，把标签做成一小段胶片</span></div>
  <div class="band">
    <video src="assets/hero-cards.mp4" autoplay muted loop playsinline></video>
    <span class="scrim"></span>
    <div class="wrap"><div class="tc"><i></i>00:00:12:04</div>
      <div><span class="tab-c">口播科普</span></div></div>
  </div>
</div>

<div class="row">
  <div class="tag"><b>方案 D</b><span>贴纸 · 斜 2.2°、带硬投影，像随手贴上去的</span></div>
  <div class="band">
    <video src="assets/hero-cards.mp4" autoplay muted loop playsinline></video>
    <span class="scrim"></span>
    <div class="wrap"><div class="tc"><i></i>00:00:12:04</div>
      <div><span class="tab-d">口播科普</span></div></div>
  </div>
</div>

<div class="row">
  <div class="tag"><b>方案 E</b><span>下三分之一条 · 编号块 + 名称，电视包装的经典做法</span></div>
  <div class="band">
    <video src="assets/hero-cards.mp4" autoplay muted loop playsinline></video>
    <span class="scrim"></span>
    <div class="wrap"><div class="tc"><i></i>00:00:12:04</div>
      <div><span class="tab-e"><b>01</b><span>口播科普</span></span></div></div>
  </div>
</div>

<div class="row">
  <div class="tag"><b>方案 F</b><span>套版叠块 · 实心块背后错位 7px 一道白线</span></div>
  <div class="band">
    <video src="assets/hero-cards.mp4" autoplay muted loop playsinline></video>
    <span class="scrim"></span>
    <div class="wrap"><div class="tc"><i></i>00:00:12:04</div>
      <div><span class="tab-f">口播科普</span></div></div>
  </div>
</div>

</body>
</html>
