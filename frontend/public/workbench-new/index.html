<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FengMotion · 独立工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c0d11;color:#e8e9ed;font:13px/1.5 system-ui,'Microsoft YaHei',sans-serif}button,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #3b8cf8;outline-offset:2px}.app{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);gap:8px;padding:8px}.panel{background:#16171d;border-radius:18px;overflow:hidden;min-width:0;min-height:0}.workspace{display:flex;flex-direction:column}.bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:none;border-bottom:1px solid #292b34}.group{display:flex;align-items:center;gap:8px}.icon{width:32px;height:32px;border:0;border-radius:9px;background:transparent;color:#a8abb7;font-size:15px}.icon:hover,.tab:hover{background:#292b34}.project{border:0;background:transparent;color:#eaebef;font-weight:600;max-width:230px;overflow:hidden;text-overflow:ellipsis}.sep{height:18px;width:1px;background:#30323c;margin:0 8px}.small{font-size:11px;color:#8e919e}.tab{border:0;background:none;color:#a6a9b4;border-radius:8px;padding:7px 10px;font-size:11px}.tab.active{background:#292d38;color:#e9ebf2}.disabled,button:disabled{opacity:.4;cursor:default}.canvas{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#101116}.screen{width:min(100%,1000px);aspect-ratio:16/9;max-height:100%;display:flex;align-items:center;justify-content:center;background:#0a0b0e;position:relative}.screen video{width:100%;height:100%;object-fit:contain;display:none}.empty{text-align:center;color:#8c909d}.empty-icon{width:48px;height:40px;border:1px solid #444751;border-radius:8px;margin:0 auto 16px;display:grid;place-items:center;color:#9ca0ad;font-size:18px}.empty b{display:block;color:#d7d9e1;font-size:13px;margin-bottom:6px}.empty p{font-size:11px;margin:0 0 16px}.button{border:1px solid #393c47;background:#23242d;color:#dfe1e8;border-radius:10px;padding:7px 12px;font-size:11px}.button.primary{background:#3b8cf8;border-color:#3b8cf8;color:white}.screen .tag{position:absolute;top:12px;left:12px;background:#101116cc;border-radius:8px;padding:4px 8px;font-size:10px;color:#d4d6df;display:none}.playback{flex:none;padding:8px 16px 12px}.progress{width:100%;height:3px;display:block;accent-color:#3b8cf8;margin:0 0 8px}.controls{display:flex;align-items:center;justify-content:space-between}.leftcontrols{display:flex;align-items:center;gap:4px}.play{width:32px;height:32px;border:0;border-radius:50%;background:#30323b;color:#fff}.time{font:11px ui-monospace,monospace;color:#a5a8b3;margin-left:12px}.rail{display:flex;gap:4px;border-bottom:1px solid #292b34;padding:0 16px;height:44px;align-items:center}.rail .spacer{flex:1}.drawer{position:absolute;z-index:3;top:104px;left:24px;width:260px;border:1px solid #363944;border-radius:12px;background:#23242d;padding:16px;display:none}.drawer.open{display:block}.drawer h3{font-size:12px;margin:0 0 16px}.item{border-radius:10px;padding:12px;background:#30323b}.item small{display:block;color:#999da9;margin-top:4px}.drawer p{font-size:11px;color:#8e919e}.chat{display:flex;flex-direction:column}.chat .bar b{font-size:12px}.chat-body{flex:1;min-height:0;padding:24px;overflow:auto}.chat-date{text-align:center;font-size:10px;color:#777b87;margin:0 0 32px}.intro b{display:block;font-size:13px;margin-bottom:8px}.intro p{color:#999da8;font-size:12px;line-height:1.8;margin:0}.composer-wrap{padding:16px}.scope{display:flex;justify-content:space-between;color:#9a9da9;font-size:11px;margin:0 0 8px}.scope b{color:#e8e9ed;font-weight:500}.composer{border:1px solid #363943;background:#23242d;border-radius:12px;padding:12px}.composer textarea{width:100%;height:82px;resize:none;border:0;outline:0;background:none;color:#e8e9ed}.composer-bottom{display:flex;justify-content:space-between;align-items:center;color:#858995;font-size:11px}.send{width:32px;height:32px;border:0;border-radius:10px;background:#3b8cf8;color:white}.foot{font-size:10px;color:#888c98;margin-top:8px}.error{font-size:11px;color:#f0a5ae} @media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 230px}.chat-body{display:none}.composer textarea{height:40px}.canvas{padding:12px}.bar{padding:0 8px}.small.hide{display:none}}
</style></head><body><main class="app"><section class="panel workspace"><header class="bar"><div class="group"><button class="icon" id="content" aria-label="内容与进度">☰</button><select class="project" id="project" aria-label="选择项目"><option>正在加载项目…</option></select><span class="sep"></span><span class="small">整片</span></div><div class="group"><button class="tab" disabled title="未接入版本">版本</button><button class="tab" disabled title="需先加载项目画面">指认画面</button><button class="icon" id="fullscreen" aria-label="全屏">⛶</button></div></header><div class="rail"><button class="tab active">画面</button><span class="small hide">项目预览</span><span class="spacer"></span><button class="tab" id="openfile">打开本地视频</button><input id="file" type="file" accept="video/*" hidden></div><div class="canvas"><div class="screen"><div class="empty"><div class="empty-icon">▷</div><b>暂无项目画面</b><p>可打开本地视频检查布局与播放控制</p><button class="button" id="openfile2">打开本地视频</button></div><video playsinline preload="metadata"></video><span class="tag">本地视频 · 未关联项目</span></div></div><div class="playback"><input class="progress" type="range" min="0" max="1000" value="0" aria-label="播放进度" disabled><div class="controls"><div class="leftcontrols"><button class="play" id="play" aria-label="播放" disabled>▶</button><button class="icon" id="back" aria-label="后退一秒" disabled>◀Ⅰ</button><button class="icon" id="forward" aria-label="前进一秒" disabled>Ⅰ▶</button><span class="time"><span id="time">--:--</span> / <span id="duration">--:--</span></span></div><span class="small" id="filename">未加载画面</span></div></div></section><aside class="panel chat"><header class="bar"><b>创作对话</b><button class="tab" disabled title="尚未连接对话">完整对话 ↗</button></header><div class="chat-body"><div class="chat-date">创作对话</div><div class="intro"><b>围绕画面继续创作</b><p>对话连接完成后，可在这里查看记录并提出修改。</p></div></div><div class="composer-wrap"><div class="scope"><span>修改范围 &nbsp; <b>整片</b></span></div><div class="composer"><textarea placeholder="描述你想修改的内容…" aria-label="修改意见" disabled></textarea><div class="composer-bottom"><span>＋ &nbsp; 添加参考</span><button class="send" disabled aria-label="发送">↑</button></div></div><div class="foot">独立工作台 · 对话尚未连接</div></div></aside></main><aside class="drawer" id="drawer"><h3>内容与进度</h3><div class="item">整片<small id="projectName">未选择项目</small></div><p>暂无可用的场景结构</p><h3 style="margin-top:24px">制作进度</h3><p>尚未连接任务状态</p></aside><script>
const base='http://127.0.0.1:8080/api',select=document.querySelector('#project'),file=document.querySelector('#file'),v=document.querySelector('video'),p=document.querySelector('#play'),r=document.querySelector('.progress');let objectUrl='';fetch(base+'/projects?limit=200').then(x=>{if(!x.ok)throw Error();return x.json()}).then(data=>{select.replaceChildren();if(!data.items?.length){select.add(new Option('暂无项目',''));return}data.items.forEach(x=>select.add(new Option(x.name||'未命名项目',x.id)));document.querySelector('#projectName').textContent=select.selectedOptions[0].textContent}).catch(()=>{select.replaceChildren(new Option('项目加载失败',''));});select.onchange=()=>{document.querySelector('#projectName').textContent=select.selectedOptions[0]?.textContent||'未选择项目'};document.querySelector('#content').onclick=()=>document.querySelector('#drawer').classList.toggle('open');document.querySelectorAll('#openfile,#openfile2').forEach(b=>b.onclick=()=>file.click());file.onchange=()=>{let f=file.files?.[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);v.src=objectUrl;v.style.display='block';document.querySelector('.empty').style.display='none';document.querySelector('.tag').style.display='block';document.querySelector('#filename').textContent=f.name;[p,r,document.querySelector('#back'),document.querySelector('#forward')].forEach(x=>x.disabled=false)};let fmt=n=>Number.isFinite(n)?String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0'):'--:--';function sync(){document.querySelector('#time').textContent=fmt(v.currentTime);document.querySelector('#duration').textContent=fmt(v.duration);r.value=v.duration?v.currentTime/v.duration*1000:0;p.textContent=v.paused?'▶':'Ⅱ'}v.onloadedmetadata=sync;v.ontimeupdate=sync;v.onplay=sync;v.onpause=sync;p.onclick=()=>v.paused?v.play():v.pause();r.oninput=()=>{if(v.duration)v.currentTime=v.duration*r.value/1000};document.querySelector('#back').onclick=()=>v.currentTime=Math.max(0,v.currentTime-1);document.querySelector('#forward').onclick=()=>v.currentTime=Math.min(v.duration,v.currentTime+1);document.querySelector('#fullscreen').onclick=()=>document.querySelector('.screen').requestFullscreen();
</script></body></html>
