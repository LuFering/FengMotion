</style></head><body><main class="shell"><section class="left"><div class="head"><div class="heading"><button class="tool" id="open" aria-label="打开内容与进度">☰</button><strong>未命名项目</strong><span class="small">/ &nbsp; 整片</span></div><div class="tools"><span class="small">视觉草图</span><button class="tool" disabled title="暂无真实版本">版本</button><button class="tool" id="select">⌖ &nbsp; 指认画面</button><button class="tool" id="full" aria-label="全屏预览">⛶</button></div></div><div class="stage"><div class="player"><div class="frame"><video src="/fx/motion/fx-dolly-zoom.mp4" preload="metadata" playsinline></video><span class="badge">示例视频 · 非项目产物</span><div class="region"><span>修改范围 · 示意</span></div></div><div class="transport"><input class="scrub" type="range" min="0" max="1000" value="0" aria-label="播放进度"><div class="controls"><div class="center-controls"><button class="play" id="play" aria-label="播放">▶</button><button class="tool" id="back" aria-label="后退一秒">◀Ⅰ</button><button class="tool" id="forward" aria-label="前进一秒">Ⅰ▶</button><div class="time"><span id="time">00:00</span> <span class="subtle">/</span> <span id="duration">--:--</span></div></div><div class="right"><button class="tool" id="full2" aria-label="全屏">⛶</button></div></div></div></div></div></section><aside class="chat"><div class="head chathead"><strong>创作对话</strong><button class="tool" title="完整对话（草图）">完整对话 &nbsp; ↗</button></div><div class="chatbody"><div class="date">创作对话</div><div class="empty"><strong>从画面开始</strong><p>选择整片或指认画面，再输入修改意见。</p></div></div><div class="composer-wrap"><div class="scope"><span>修改范围 &nbsp; <strong id="scope">整片</strong></span><button class="clear" id="clear" aria-label="移除修改范围" disabled>×</button></div><div class="composer"><textarea placeholder="描述你想修改的内容…" aria-label="修改意见"></textarea><div class="composer-footer"><span>＋ &nbsp; 添加参考</span><button class="send" disabled aria-label="发送">↑</button></div></div><div class="foot">视觉草图 · 未连接创作服务</div></div></aside></main><aside class="drawer" id="drawer"><h3>内容与进度</h3><div class="item">整片<small>未命名项目</small></div><p>暂无可用的场景结构</p><div class="progress">制作进度 <span>暂无任务</span><div class="progress-line"></div><small>有制作任务时在此显示</small></div></aside><script>
const v=document.querySelector('video'),p=document.querySelector('#play'),r=document.querySelector('.scrub'),scope=document.querySelector('#scope'),region=document.querySelector('.region'),clear=document.querySelector('#clear');const fmt=n=>Number.isFinite(n)?String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0'):'--:--';function sync(){document.querySelector('#time').textContent=fmt(v.currentTime);document.querySelector('#duration').textContent=fmt(v.duration);r.value=v.duration?v.currentTime/v.duration*1000:0;p.textContent=v.paused?'▶':'Ⅱ'}v.onloadedmetadata=()=>{v.currentTime=Math.min(2,v.duration);sync()};v.ontimeupdate=sync;v.onplay=sync;v.onpause=sync;p.onclick=()=>v.paused?v.play():v.pause();r.oninput=()=>{if(v.duration)v.currentTime=v.duration*r.value/1000};document.querySelector('#back').onclick=()=>v.currentTime=Math.max(0,v.currentTime-1);document.querySelector('#forward').onclick=()=>v.currentTime=Math.min(v.duration,v.currentTime+1);document.querySelectorAll('#full,#full2').forEach(b=>b.onclick=()=>document.querySelector('.frame').requestFullscreen());document.querySelector('#open').onclick=()=>document.querySelector('#drawer').classList.toggle('on');document.querySelector('#select').onclick=()=>{region.classList.add('on');scope.textContent='画面区域（示意）';clear.disabled=false};clear.onclick=()=>{region.classList.remove('on');scope.textContent='整片';clear.disabled=true};
