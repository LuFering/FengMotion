<!doctype html>
<html lang="zh" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>镜 14 · 看不见 token</title>
    <script src="../gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      @font-face { font-family: "Noto Sans SC"; font-weight: 900;
        src: url("../assets/fonts/noto-sans-sc-900.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500;
        src: url("../assets/fonts/plex-mono-500.woff2") format("woff2"); font-display: block; }

      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #space {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 118% 78% at 50% 40%,
          #1e222a 0%, #161a20 44%, #0e1115 76%, #090a0d 100%);
      }
      #lightpool {
        position: absolute; left: 50%; top: -26%;
        width: 1500px; height: 900px; margin-left: -750px;
        background: radial-gradient(ellipse 50% 50% at 50% 50%,
          rgba(214,228,255,0.15) 0%, rgba(180,200,240,0.05) 40%, rgba(0,0,0,0) 74%);
      }
      #stage { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 48%; }
      #camera { position: absolute; inset: 0; transform-style: preserve-3d; }

      /* 与 s13 完全相同的手机（元素继承 —— 同一部） */
      #phone {
        position: absolute; left: 50%; top: 50%;
        width: 640px; height: 1010px;
        margin-left: -320px; margin-top: -505px;
        border-radius: 64px;
        background: linear-gradient(158deg, #3a3f47 0%, #23272e 44%, #14171b 100%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -2px 0 rgba(0,0,0,0.5),
                    0 60px 130px rgba(0,0,0,0.78);
      }
      #screen {
        position: absolute; inset: 14px; border-radius: 48px; overflow: hidden;
        background: linear-gradient(180deg, #fbfbfc 0%, #f2f3f5 60%, #e9eaee 100%);
      }
      #notch { position: absolute; left: 50%; top: 12px; width: 120px; height: 32px;
        margin-left: -60px; border-radius: 17px; background: #0c0d0f; }
      #appBar { position: absolute; left: 0; right: 0; top: 0; height: 116px;
        background: linear-gradient(180deg, #fff 0%, #fbfbfc 100%); box-shadow: 0 1px 0 rgba(0,0,0,0.06); }
      #appTitle { position: absolute; left: 30px; bottom: 20px;
        font-family: "Noto Sans SC", sans-serif; font-weight: 900; font-size: 29px; color: #14171b; }
      #appDot { position: absolute; right: 28px; bottom: 24px; width: 36px; height: 36px;
        border-radius: 50%; background: linear-gradient(158deg, #4a5058, #23272e); }
      #chat { position: absolute; left: 0; right: 0; top: 116px; bottom: 146px;
        padding: 24px 28px; overflow: hidden;
        display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
      .bubble {
        max-width: 470px; padding: 20px 24px; border-radius: 22px;
        font-family: "Noto Sans SC", sans-serif; font-weight: 900;
        font-size: 25px; line-height: 1.6; color: #14171b;
        background: #fff; box-shadow: 0 3px 12px rgba(0,0,0,0.07);
      }
      .bubble.me { align-self: flex-end;
        background: linear-gradient(158deg, #3a4048, #23272e); color: #f2f3f5; }
      #inputBar { position: absolute; left: 0; right: 0; bottom: 0; height: 146px;
        background: linear-gradient(180deg, #fbfbfc 0%, #fff 100%); box-shadow: 0 -1px 0 rgba(0,0,0,0.06); }
      #inputField { position: absolute; left: 26px; right: 104px; top: 34px; height: 78px;
        border-radius: 39px; background: #eff0f3; }
      #sendBtn { position: absolute; right: 26px; top: 34px; width: 78px; height: 78px;
        border-radius: 50%; background: linear-gradient(158deg, #4a5058, #23272e); }
      #caret { position: absolute; left: 30px; top: 22px; width: 2px; height: 34px;
        background: #14171b; opacity: 0; }

      /* ── 找 token 的"探照"：一圈扫描光，扫过屏幕 ── */
      #scanline {
        position: absolute; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.85) 50%, rgba(255,255,255,0) 100%);
        box-shadow: 0 0 24px 8px rgba(255,255,255,0.35);
        opacity: 0;
      }
      /* "找过但没找到"的视觉语法：放大镜 + 一道横杠。
         刻意**不打字** —— 这是中文口播片，打英文字幕读作"字幕化"。 */
      #searchBox {
        position: absolute; left: 50%; top: 50%;
        width: 300px; height: 300px;
        margin-left: 420px; margin-top: -150px;
        opacity: 0;
      }
      #searchBox svg { width: 100%; height: 100%; display: block; }
      #searchBox .bar {
        position: absolute; left: 24px; right: 24px; top: 50%; height: 11px;
        margin-top: -5.5px; border-radius: 5px;
        background: linear-gradient(90deg, rgba(255,90,82,0) 0%, #ff5a52 12%, #ff5a52 88%, rgba(255,90,82,0) 100%);
        opacity: 0;
      }
      /* 围绕手机的"什么都没有"提示：一圈很淡的虚线 */
      #emptyRing {
        position: absolute; left: 50%; top: 50%;
        width: 900px; height: 1200px; margin-left: -450px; margin-top: -600px;
        border-radius: 80px;
        box-shadow: 0 0 0 1px rgba(214,228,255,0.13);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s14" data-start="0" data-duration="6.6"
         data-width="1920" data-height="1080">
      <div id="space"     class="clip" data-start="0" data-duration="6.6" data-track-index="0"></div>
      <div id="lightpool" class="clip" data-start="0" data-duration="6.6" data-track-index="1" data-layout-allow-overflow></div>

      <div id="stage" class="clip" data-start="0" data-duration="6.6" data-track-index="2">
        <div id="camera">
          <div id="emptyRing"></div>
          <div id="phone">
            <div id="screen">
              <div id="appBar"><div id="appTitle">AI 助手</div><div id="appDot"></div></div>
              <div id="notch"></div>
              <div id="chat">
                <div class="bubble me" id="b1">帮我写一份活动方案</div>
                <div class="bubble" id="b2">好的，方案我已经写好了，包含目标、流程和预算三部分…</div>
              </div>
              <div id="inputBar">
                <div id="inputField"><div id="caret"></div></div>
                <div id="sendBtn"></div>
              </div>
              <div id="scanline"></div>
            </div>
          </div>
          <div id="searchBox">
            <svg viewBox="0 0 220 220" width="220" height="220">
              <circle cx="92" cy="92" r="62" fill="none" stroke="#8b93a1" stroke-width="7"/>
              <line x1="137" y1="137" x2="188" y2="188" stroke="#8b93a1" stroke-width="7" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 承 s13 末态：同一部手机、同一位置
      gsap.set('#phone', { z: -150 });
      gsap.set('#b1', { opacity: 1, y: 0 });
      gsap.set('#b2', { opacity: 0, y: 18 });
      gsap.set('#scanline', { y: 200, opacity: 0 });
      gsap.set('#searchBox .bar', { opacity: 0, scaleX: 0.2 });

      // ── 时间表（30fps）──────────────────────────────────────────
      //  本镜的"信息"就是**看不见** —— 所以画面要克制、几乎不动
      //  0.00–0.60  承 s13：手机与对话在场
      //  0.60–1.40  AI 流畅回答（气泡浮现）
      //  1.40–3.40  一圈扫描光自上而下扫过整个屏幕 —— 在"找 token"
      //  3.40–4.10  扫描结束，什么都没找到
      //  4.10–4.80  结论标记浮出（NO TOKEN ANYWHERE）
      //  4.80–6.60  几乎静止，只做极微呼吸 —— 让"空"被感受到
      const T_ANS   = 0.60;
      const T_SCAN  = 1.40;
      const T_NONE  = 3.40;
      const T_MARK  = 4.10;
      const T_HOLD  = 4.80;

      // ① AI 回答浮现（长气泡分两次出现，像真的在生成）
      tl.fromTo('#b2', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power2.out' }, T_ANS);
      tl.set('#caret', { opacity: 1 }, T_ANS);

      // ② 扫描：一圈光从屏幕上沿扫到下沿（"找 token"）
      tl.to('#scanline', { opacity: 1, duration: 0.20, ease: 'none' }, T_SCAN);
      tl.to('#scanline', { y: 900, duration: 1.90, ease: 'sine.inOut' }, T_SCAN + 0.10);
      tl.to('#scanline', { opacity: 0, duration: 0.30, ease: 'none' }, T_NONE - 0.20);

      // ③ 什么都没找到 —— 结论标记浮出（很轻，不是大字报）
      // 放大镜浮现 + 一道红杠划掉（"没找到"）—— 不打字
      tl.fromTo('#searchBox', { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.55, ease: 'power3.out' }, T_MARK);
      tl.set('#searchBox .bar', { transformOrigin: '0% 50%' }, T_MARK + 0.30);
      tl.to('#searchBox .bar', { opacity: 1, scaleX: 1, duration: 0.42, ease: 'power3.out' }, T_MARK + 0.34);
      tl.to('#emptyRing', { opacity: 1, duration: 0.70, ease: 'power2.out' }, T_MARK + 0.10);

      // ④ 几乎静止（本镜刻意"不动" —— 空就是信息）
      tl.to('#phone', { z: -140, duration: 1.60, ease: 'sine.inOut' }, T_HOLD);
      tl.to('#b2', { y: -5, duration: 1.40, ease: 'sine.inOut' }, T_HOLD + 0.20);

      window.__timelines['s14'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
