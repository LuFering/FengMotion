<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>素材库 — Token 科普视频</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5/index.css" />
    <style>
      :root{
        --bg:#0a0c12;
        --bg-rail:#04060a;
        --bg-top:#0c0f16;
        --panel:#10131d;
        --panel-head:#131725;
        --field:#141826;
        --border:#1f2434;
        --border-soft:#232839;
        --text:#eceef4;
        --text-2:#c3c8d6;
        --muted:#8b91a3;
        --faint:#6d7387;
        --orange:#fb923c;
        --orange-bg:#33200f;
        --green:#4ade80;
        --green-bg:#0f2c1e;
        --blue:#4f6bff;
        --radius:12px;
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;
        background:var(--bg);
        color:var(--text);
        font-family:"Geist Variable","Geist",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
        font-size:14px;
        -webkit-font-smoothing:antialiased;
        overflow-x:hidden;
      }
      button{font-family:inherit;background:none;border:0;color:inherit;cursor:pointer;padding:0}
      svg{display:block}
      ::-webkit-scrollbar{width:10px;height:10px}
      ::-webkit-scrollbar-thumb{background:#232839;border-radius:6px;border:2px solid var(--bg)}
      ::-webkit-scrollbar-track{background:transparent}

      /* ============ layout ============ */
      .app{display:flex;min-height:100vh}
      .main{flex:1;min-width:0;display:flex;flex-direction:column}

      /* ============ left rail ============ */
      .rail{
        position:fixed;left:0;top:0;bottom:0;width:64px;z-index:40;
        background:var(--bg-rail);
        border-right:1px solid #12151f;
        display:flex;flex-direction:column;align-items:center;
        padding:10px 0 12px;
      }
      .rail-btn{
        width:38px;height:38px;border-radius:10px;
        display:flex;align-items:center;justify-content:center;
        color:#aeb4c4;margin-bottom:6px;
        transition:background .15s,color .15s;
      }
      .rail-btn:hover{background:#141824;color:#fff}
      .rail-btn.active{color:#fff}
      .rail-btn svg{width:20px;height:20px}
      .rail-spacer{flex:1}
      .mark{
        border-radius:22%;
        background:linear-gradient(145deg,#454b5c,#2e3342);
        display:flex;align-items:flex-end;justify-content:center;
        overflow:hidden;flex:none;
      }
      .mark i{
        display:block;background:#f4f5f7;border-radius:999px 999px 0 0;
      }
      .mark.sm{width:22px;height:22px}
      .mark.sm i{width:12px;height:6px;margin-bottom:5px}
      .mark.lg{width:64px;height:64px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
      .mark.lg i{width:34px;height:17px;margin-bottom:14px}
      .mark.rail-mark{width:34px;height:34px;border-radius:9px}
      .mark.rail-mark i{width:18px;height:9px;margin-bottom:7px}

      /* ============ top bar ============ */
      .topbar{
        height:48px;flex:none;
        background:var(--bg-top);
        border-bottom:1px solid #171b28;
        display:flex;align-items:center;gap:10px;
        padding:0 16px 0 20px;
        position:sticky;top:0;z-index:30;
      }
      .crumbs{display:flex;align-items:center;gap:9px;font-size:13.5px;min-width:0;white-space:nowrap;overflow:hidden}
      .crumbs .c1{color:#dfe3ec;font-weight:500}
      .crumbs .sep{color:#565d70}
      .crumbs .c2{color:#9aa1b3}
      .top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
      .win-btn{
        width:26px;height:26px;border-radius:6px;
        display:flex;align-items:center;justify-content:center;color:#7d8499;
      }
      .win-btn:hover{background:#171b28;color:#c3c8d6}
      .win-btn.on{background:var(--blue);color:#fff}
      .win-btn svg{width:14px;height:14px}

      /* ============ hero ============ */
      .hero{position:relative;height:352px;flex:none;overflow:hidden;background:#171310}
      .hero img.bg{
        position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%;
      }
      .hero .fade{
        position:absolute;inset:0;
        background:linear-gradient(180deg,rgba(10,12,18,.18) 0%,rgba(10,12,18,0) 34%,rgba(10,12,18,.42) 68%,var(--bg) 97%);
      }
      .hero-actions{position:absolute;top:16px;right:20px;display:flex;gap:8px;z-index:3}
      .pill-btn{
        display:flex;align-items:center;gap:7px;
        background:rgba(6,7,11,.88);border:1px solid #262b3a;border-radius:8px;
        color:#e6e9f1;font-size:13px;font-weight:500;
        padding:7px 12px;backdrop-filter:blur(6px);
      }
      .pill-btn:hover{border-color:#39415a}
      .pill-btn svg{width:15px;height:15px}
      .pill-btn .chev{width:13px;height:13px;color:#9aa1b3}
      .hero-content{position:absolute;left:24px;bottom:20px;z-index:2}
      .hero h1{
        margin:14px 0 0;font-size:38px;line-height:1.1;font-weight:600;letter-spacing:-.02em;color:#fff;
      }
      .hero-meta{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:13.5px;color:#c9cede}
      .hero-meta .flame{color:#f59e0b;display:flex}
      .hero-meta .flame svg{width:14px;height:14px}
      .hero-meta .dot{color:#565d70}
      .hero-meta .dim{color:#9aa1b3}

      /* ============ toolbar ============ */
      .toolbar{
        flex:none;display:flex;align-items:center;gap:4px;
        padding:12px 24px 10px;flex-wrap:wrap;
      }
      .tool{
        display:flex;align-items:center;gap:7px;
        font-size:13px;color:#c9cede;font-weight:500;
        padding:6px 9px;border-radius:7px;white-space:nowrap;
      }
      .tool:hover{background:#141826;color:#fff}
      .tool svg{width:15px;height:15px;color:#9aa1b3}
      .tool .dim{color:#767d92;font-weight:400}
      .tool-sep{width:1px;height:18px;background:#232839;margin:0 8px}

      /* ============ content / groups ============ */
      .content{padding:6px 24px 76px}
      .group{
        background:var(--panel);
        border:1px solid var(--border);
        border-radius:var(--radius);
        margin-bottom:18px;overflow:hidden;
      }
      .group-head{
        width:100%;display:flex;align-items:center;gap:8px;
        background:var(--panel-head);
        padding:11px 16px;font-size:13px;text-align:left;
        border-bottom:1px solid var(--border);
      }
      .group-head .chev{color:#9aa1b3;display:flex;transition:transform .18s}
      .group-head .chev svg{width:15px;height:15px}
      .group.closed .group-head .chev{transform:rotate(-90deg)}
      .group-head .g-label{color:var(--muted)}
      .group-head .g-value{font-weight:600}
      .group-head .g-value.review{color:var(--orange)}
      .group-head .g-value.approved{color:var(--green)}
      .group-head .swap{color:#767d92;display:flex;margin:0 2px 0 6px}
      .group-head .swap svg{width:13px;height:13px}
      .group.closed .grid{display:none}
      .group.closed .group-head{border-bottom:0}

      .chip{
        display:inline-flex;align-items:center;gap:6px;
        background:#222739;border:1px solid #2b3049;border-radius:999px;
        padding:2px 9px 2px 3px;font-size:12px;color:#dfe3ec;font-weight:500;
      }
      .chip .x{color:#8b91a3;display:flex}
      .chip .x svg{width:11px;height:11px}
      .avatar{
        width:18px;height:18px;border-radius:50%;flex:none;
        display:flex;align-items:center;justify-content:center;
        font-size:8.5px;font-weight:700;color:#fff;letter-spacing:.02em;
      }
      .avatar.jt{background:linear-gradient(135deg,#b06a2f,#6e3b16)}
      .avatar.jv{background:linear-gradient(135deg,#5b54c7,#2c2766)}
      .avatar.wz{background:linear-gradient(135deg,#3d7f8c,#1f4550)}

      .grid{
        display:grid;grid-template-columns:repeat(5,1fr);gap:16px;
        padding:16px;
      }

      /* ============ asset card ============ */
      .card{min-width:0}
      .thumb{
        position:relative;border-radius:8px;overflow:hidden;cursor:pointer;
        aspect-ratio:16/9.2;background:#1a130c;
      }
      .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
      .thumb .zoom{transform:scale(1.45)}
      .card:hover .thumb img{transform:scale(1.04)}
      .card:hover .thumb img.zoom{transform:scale(1.52)}
      .thumb::after{
        content:"";position:absolute;inset:0;border-radius:8px;
        box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);pointer-events:none;
      }
      .card.selected .thumb{box-shadow:0 0 0 2px var(--blue)}
      .cbx{
        position:absolute;top:8px;left:8px;width:17px;height:17px;border-radius:5px;
        background:rgba(10,11,16,.45);border:1.5px solid rgba(255,255,255,.55);
        display:flex;align-items:center;justify-content:center;color:#fff;
        opacity:0;transition:opacity .15s;z-index:3;padding:0;
      }
      .card:hover .cbx,.card.selected .cbx{opacity:1}
      .card.selected .cbx{background:var(--blue);border-color:var(--blue)}
      .cbx svg{width:11px;height:11px;opacity:0}
      .card.selected .cbx svg{opacity:1}
      .thumb .play-hover{
        position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        background:rgba(5,6,10,.28);opacity:0;transition:opacity .18s;z-index:2;
      }
      .card:hover .play-hover{opacity:1}
      .play-hover span{
        width:46px;height:46px;border-radius:50%;
        background:rgba(8,9,14,.72);border:1px solid rgba(255,255,255,.25);
        display:flex;align-items:center;justify-content:center;color:#fff;
        backdrop-filter:blur(4px);
      }
      .play-hover svg{width:18px;height:18px;margin-left:2px}
      .cmt{
        position:absolute;left:8px;bottom:8px;z-index:2;
        display:flex;align-items:center;gap:5px;
        background:rgba(8,9,14,.78);border-radius:6px;
        font-size:11.5px;font-weight:600;color:#fff;padding:3px 7px;
        font-variant-numeric:tabular-nums;
      }
      .cmt svg{width:12px;height:12px}
      .badges{position:absolute;right:8px;bottom:8px;z-index:2;display:flex;gap:5px}
      .bdg{
        background:rgba(8,9,14,.78);border-radius:6px;
        font-size:11.5px;font-weight:600;color:#fff;padding:3px 7px;
        font-variant-numeric:tabular-nums;letter-spacing:.02em;
      }
      .fname-row{display:flex;align-items:flex-start;gap:6px;margin-top:10px}
      .fname{
        font-size:13.5px;font-weight:600;color:#eef0f6;letter-spacing:-.01em;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;
      }
      .dots{color:#767d92;display:flex;padding:2px;border-radius:5px;flex:none}
      .dots:hover{background:#1a1f30;color:#c3c8d6}
      .dots svg{width:16px;height:16px}
      .fmeta{font-size:12px;color:#7d8499;margin-top:3px}
      .field{
        border:1px solid var(--border-soft);background:var(--field);
        border-radius:8px;padding:8px 10px 9px;margin-top:10px;
      }
      .flabel{display:flex;align-items:center;gap:6px;font-size:12px;color:#9aa1b5}
      .flabel svg{width:13px;height:13px;color:#767d92}
      .field .val{margin-top:7px;display:flex}
      .pill{
        display:inline-flex;align-items:center;border-radius:999px;
        font-size:12px;font-weight:600;padding:3px 10px;
      }
      .pill.review{background:var(--orange-bg);color:var(--orange)}
      .pill.approved{background:var(--green-bg);color:var(--green)}

      /* ============ footer ============ */
      .statusbar{
        position:fixed;left:64px;right:0;bottom:0;height:48px;z-index:25;
        display:flex;align-items:center;padding:0 24px;
        font-size:13px;color:#9aa1b3;
        background:linear-gradient(180deg,rgba(10,12,18,0),rgba(6,7,11,.94) 45%);
        pointer-events:none;
      }

      /* ============ player modal ============ */
      .overlay{
        position:fixed;inset:0;z-index:100;background:rgba(3,4,7,.78);
        backdrop-filter:blur(6px);
        display:none;align-items:center;justify-content:center;padding:22px;
      }
      .overlay.open{display:flex}
      .player{
        width:min(1080px,96vw);max-height:94vh;overflow:auto;
        background:#0d1017;border:1px solid #262b3d;border-radius:14px;
        box-shadow:0 30px 80px rgba(0,0,0,.6);
      }
      .player-head{
        display:flex;align-items:center;gap:10px;padding:13px 16px;
        border-bottom:1px solid #1d2233;
      }
      .player-head .pname{font-size:14px;font-weight:600}
      .player-head .psub{font-size:12px;color:var(--muted)}
      .icon-btn{
        width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
        color:#9aa1b3;margin-left:auto;flex:none;
      }
      .icon-btn:hover{background:#1a1f30;color:#fff}
      .icon-btn svg{width:16px;height:16px}
      .stage{position:relative;background:#000;aspect-ratio:16/9}
      .stage canvas{width:100%;height:100%;display:block}
      .stage .big-play{
        position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        background:rgba(0,0,0,.25);cursor:pointer;
      }
      .stage .big-play span{
        width:64px;height:64px;border-radius:50%;
        background:rgba(10,11,16,.75);border:1px solid rgba(255,255,255,.3);
        display:flex;align-items:center;justify-content:center;color:#fff;
      }
      .stage .big-play svg{width:24px;height:24px;margin-left:3px}
      .stage .tc-burn{
        position:absolute;right:12px;bottom:10px;
        font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;color:rgba(255,255,255,.85);
        background:rgba(0,0,0,.45);padding:2px 7px;border-radius:5px;font-variant-numeric:tabular-nums;
      }
      .transport{
        display:flex;align-items:center;gap:12px;padding:12px 16px 6px;
      }
      .t-btn{
        width:34px;height:34px;border-radius:8px;background:#171b29;border:1px solid #242a3e;
        display:flex;align-items:center;justify-content:center;color:#e6e9f1;flex:none;
      }
      .t-btn:hover{border-color:#39415a}
      .t-btn svg{width:15px;height:15px}
      .tc{
        font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;color:#c3c8d6;
        font-variant-numeric:tabular-nums;white-space:nowrap;
      }
      .tc .dim{color:#6d7387}
      .progress{
        flex:1;height:22px;display:flex;align-items:center;cursor:pointer;min-width:60px;
      }
      .progress .track{position:relative;height:5px;border-radius:3px;background:#262c42;width:100%}
      .progress .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#e8b04b;width:0%}
      .progress .knob{
        position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;
        transform:translate(-50%,-50%);left:0%;box-shadow:0 1px 5px rgba(0,0,0,.5);
      }
      .player-foot{
        display:flex;gap:18px;padding:8px 16px 16px;flex-wrap:wrap;
      }
      .p-comments{flex:1;min-width:260px}
      .p-comments h3{margin:4px 0 10px;font-size:13px;font-weight:600;color:#dfe3ec}
      .comment{display:flex;gap:9px;margin-bottom:12px}
      .comment .avatar{width:24px;height:24px;font-size:10px}
      .comment .cname{font-size:12.5px;font-weight:600}
      .comment .ctc{
        font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#e8b04b;
        background:rgba(232,176,75,.12);border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:500;
      }
      .comment .ctext{font-size:12.5px;color:#aab0c0;margin-top:2px;line-height:1.45}
      .p-actions{width:230px;flex:none}
      .p-actions h3{margin:4px 0 10px;font-size:13px;font-weight:600;color:#dfe3ec}
      .p-actions .cur{display:flex;margin-bottom:12px}
      .act-btn{
        width:100%;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;
        display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:8px;
      }
      .act-btn svg{width:15px;height:15px}
      .act-btn.approve{background:#14532d;color:#bbf7d0}
      .act-btn.approve:hover{background:#166534}
      .act-btn.review{background:#3a2410;color:#fed7aa}
      .act-btn.review:hover{background:#4a2d13}
      .p-meta{font-size:12px;color:var(--muted);line-height:1.7}
      .p-meta b{color:#c3c8d6;font-weight:500}

      .toast{
        position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);
        background:#171c2a;border:1px solid #2b3049;color:#e6e9f1;
        font-size:13px;padding:9px 16px;border-radius:9px;z-index:200;
        opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
        box-shadow:0 12px 32px rgba(0,0,0,.5);
      }
      .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

      @media (max-width:1280px){ .grid{grid-template-columns:repeat(4,1fr)} }
      @media (max-width:1024px){ .grid{grid-template-columns:repeat(3,1fr)} .hero{height:320px} }
      @media (hover:none){
        .cbx{opacity:1;background:rgba(10,11,16,.35)}
      }
      @media (max-width:760px){
        .group-head{flex-wrap:wrap;row-gap:6px}
        .grid{grid-template-columns:repeat(2,1fr)}
        .hero h1{font-size:29px}
        .mark.lg{width:50px;height:50px}
        .mark.lg i{width:27px;height:13px;margin-bottom:11px}
        .content{padding:6px 14px 76px}
        .toolbar{padding:12px 14px 10px}
        .hero-content{left:16px}
        .p-actions{width:100%}
      }
      @media (max-width:480px){ .grid{grid-template-columns:1fr} }
    
      @font-face{font-family:'Big Shoulders Display';src:url('/ledger/big-shoulders-800.woff2') format('woff2');font-weight:800}
      @font-face{font-family:'Noto Sans SC';src:url('/ledger/noto-sans-sc-900.woff2') format('woff2');font-weight:900}
      @font-face{font-family:'IBM Plex Mono';src:url('/ledger/plex-mono-500.woff2') format('woff2');font-weight:500}
      .type-specimen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;height:100%;background:linear-gradient(160deg,#181c28,#0e1119)}
      .type-specimen .ts-big{font-size:34px;color:var(--text);line-height:1}
      .type-specimen .ts-name{font-size:10px;color:var(--muted);letter-spacing:.04em;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .pill.blocked{background:#331520;color:#f8717f}
      .g-value.blocked{color:#f8717f}
          .agent-chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:999px;background:var(--field);color:var(--muted);font-size:11px;white-space:nowrap}
      .agent-chip i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
    </style>
  </head>
  <body>
    <div class="app">
      <!-- ======== left rail ======== -->
      
      <div class="main">
        <!-- ======== top bar ======== -->
        <header class="topbar">
          <div class="crumbs">
            <span class="mark sm"><i></i></span>
            <span class="c1">全部项目</span>
            <span class="sep">/</span>
            <span class="c2">Token 科普视频</span>
          </div>
          <div class="top-right">
            <span class="agent-chip"><i></i>Agent 未连接</span>
            <button class="win-btn" title="Panel" data-ic="panel-l"></button>
            <button class="win-btn on" title="Panel" data-ic="panel-c"></button>
            <button class="win-btn" title="Panel" data-ic="panel-r"></button>
          </div>
        </header>

        <!-- ======== hero ======== -->
        <section class="hero">
          <img class="bg" src="/frames/film/s13.jpg" alt="Token 科普视频 成片画面（s13）" />
          <div class="fade"></div>
          <div class="hero-actions">
            <button class="pill-btn" data-team><span data-ic="users"></span>素材台账<span class="chev" data-ic="chev-d"></span></button>
            <button class="pill-btn" data-copy><span data-ic="copy-ic"></span>复制清单</button>
          </div>
          <div class="hero-content">
            <div class="mark lg"><i></i></div>
            <h1>Token 科普视频</h1>
            <div class="hero-meta">
              <span class="flame" data-ic="flame"></span>
              <span>FengMotion 素材台账</span>
              <span class="dot">•</span>
              <span class="dim">11 项素材 · 需署名 5 · 不可商用 1</span>
            </div>
          </div>
        </section>

        <!-- ======== toolbar ======== -->
        <div class="toolbar">
          <button class="tool"><span data-ic="folder"></span>全部素材</button>
          <span class="tool-sep"></span>
          <button class="tool"><span data-ic="layout"></span>外观</button>
          <button class="tool"><span data-ic="fields"></span>字段</button>
          <button class="tool"><span data-ic="filter"></span>筛选</button>
          <button class="tool"><span data-ic="group"></span>分组</button>
          <button class="tool"><span data-ic="sort"></span>排序 · <span class="dim">台账顺序</span></button>
        </div>

        <!-- ======== groups ======== -->
        <main class="content" id="content"></main>
      </div>
    </div>

    <div class="statusbar" id="statusbar">32 items</div>

    <!-- ======== player ======== -->
    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Asset monitor">
      <div class="player">
        <div class="player-head">
          <div>
            <div class="pname" id="pName">—</div>
            <div class="psub" id="pSub">—</div>
          </div>
          <button class="icon-btn" id="pClose" title="Close (Esc)"><span data-ic="x"></span></button>
        </div>
        <div class="stage">

          <div class="big-play" id="bigPlay"><span data-ic="play-big"></span></div>

          <button class="t-btn" id="playBtn" title="Play / pause"><span data-ic="play"></span></button>
          <button class="t-btn" id="restartBtn" title="Back to start"><span data-ic="restart"></span></button>

          <div class="progress" id="progress"><div class="track"><div class="fill" id="pFill"></div><div class="knob" id="pKnob"></div></div></div>

        </div>

          <div class="p-comments">
            <h3 id="cTitle">Comments</h3>
            <div id="cList"></div>
          </div>
          <div class="p-actions">
            <h3>Review</h3>
            <div class="cur" id="pStatus"></div>
            <button class="act-btn approve" id="approveBtn"><span data-ic="check"></span>Approve</button>
            <button class="act-btn review" id="reviewBtn"><span data-ic="flag"></span>Needs Review</button>
            <div class="p-meta" id="pMeta"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      /* ================= icons (lucide-style paths) ================= */
      var P = {
        home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
        search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
        bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
        upload:'<path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/>',
        help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
        bulb:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
        grid:'<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
        gear:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
        users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
        sliders:'<line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/>',
        'chev-d':'<path d="m6 9 6 6 6-6"/>',
        flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
        folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
        layout:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
        fields:'<path d="M3 3h18"/><path d="M7 12h10"/><path d="M10 21h4"/><circle cx="12" cy="7" r="1.6"/><circle cx="12" cy="17" r="1.6"/>',
        filter:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/>',
        group:'<path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h13"/><circle cx="19" cy="12" r="1.4"/><circle cx="20" cy="18" r="1.4"/>',
        sort:'<path d="m3 8 4-4 4 4"/><path d="M7 4v16"/><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/>',
        msg:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
        dots:'<circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/>',
        status:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
        user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
        x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
        check:'<path d="M20 6 9 17l-5-5"/>',
        'copy-ic':'<rect width="9" height="9" x="9" y="9" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
        swap:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
        play:'<path d="M6 4.5v15l13-7.5z"/>',
        pause:'<rect x="5" y="4" width="4.5" height="16" rx="1"/><rect x="14.5" y="4" width="4.5" height="16" rx="1"/>',
        restart:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
        volume:'<path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.6 5.4a9 9 0 0 1 0 13.2"/>',
        max:'<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
        flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>',
        'panel-l':'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
        'panel-c':'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/>',
        'panel-r':'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/>'
      };
      function icon(name, size){
        var s = size || 24;
        return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(P[name]||'')+'</svg>';
      }
      document.querySelectorAll('[data-ic]').forEach(function(el){
        var n = el.getAttribute('data-ic');
        if(n==='play-big'){ el.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>'; return; }
        if(n==='flame'){ el.innerHTML = icon('flame',14); return; }
        el.innerHTML = icon(n, 24);
      });

      /* ================= data ================= */
      var ASSETS = [
        {id:1, name:'jensen.jpg', img:'/ledger/jensen.jpg', pos:'50% 20%', comments:0, dur:6, status:'attn', kind:'图片', source:'Wikimedia Commons', license:'CC BY-SA 4.0', used:2},
        {id:2, name:'altman.jpg', img:'/ledger/altman.jpg', pos:'50% 25%', comments:0, dur:6, status:'attn', kind:'图片', source:'Wikimedia Commons', license:'CC BY 4.0', used:1},
        {id:3, name:'musk.jpg', img:'/ledger/musk.jpg', pos:'50% 20%', comments:0, dur:6, status:'attn', kind:'图片', source:'Wikimedia Commons', license:'CC BY-SA 4.0', used:1},
        {id:4, name:'nadella.jpg', img:'/ledger/nadella.jpg', pos:'50% 20%', comments:0, dur:6, status:'attn', kind:'图片', source:'Wikimedia Commons', license:'CC BY 4.0', used:1},
        {id:5, name:'pichai.jpg', img:'/ledger/pichai.jpg', pos:'50% 20%', comments:0, dur:6, status:'attn', kind:'图片', source:'Wikimedia Commons', license:'CC BY 4.0', used:1},
        {id:6, name:'big-shoulders-800.woff2', img:'', spec:'Big Shoulders Display', font:'/ledger/big-shoulders-800.woff2', pos:'', comments:0, dur:0, status:'ok', kind:'字体', source:'Google Fonts', license:'OFL 1.1', used:3},
        {id:7, name:'noto-sans-sc-900.woff2', img:'', spec:'Noto Sans SC', font:'/ledger/noto-sans-sc-900.woff2', pos:'', comments:0, dur:0, status:'ok', kind:'字体', source:'Google Fonts', license:'OFL 1.1', used:'all'},
        {id:8, name:'plex-mono-500.woff2', img:'', spec:'IBM Plex Mono', font:'/ledger/plex-mono-500.woff2', pos:'', comments:0, dur:0, status:'ok', kind:'字体', source:'IBM', license:'OFL 1.1', used:2},
        {id:9, name:'tv-off.wav', img:'/ledger/tv-off-wave.png', pos:'center', comments:0, dur:6, status:'ok', kind:'音频', source:'自制', license:'CC0', used:1},
        {id:10, name:'intro.mp4', img:'/ledger/intro-frame.jpg', pos:'center', comments:0, dur:9, status:'ok', kind:'视频', source:'自制', license:'CC0', used:1},
        {id:11, name:'拆解报告 round2', img:'/ledger/report.png', pos:'center', comments:0, dur:6, status:'blocked', kind:'文档', source:'内部研究', license:'仅内部', used:0}
      ];
      var COMMENT_POOL = [];
      var selected = {};

      function fmtDur(s){ return '00:' + String(s).padStart(2,'0'); }
      function pillHTML(st){
        var m = { attn:['review','需署名'], ok:['approved','可商用'], blocked:['blocked','不可商用'] };
        return '<span class="pill '+m[st][0]+'">'+m[st][1]+'</span>';
      }
      function cardHTML(a){
        return '<article class="card'+(selected[a.id]?' selected':'')+'" data-id="'+a.id+'">'
          + '<div class="thumb" data-open="'+a.id+'" role="button" tabindex="0" aria-label="Open '+a.name+' in monitor">'
          +   (a.font
          ? '<div class="type-specimen" style="font-family:\''+a.spec+'\'"><span class="ts-big">Aa 字</span><span class="ts-name">'+a.name+'</span></div>'
          : '<img src="'+a.img+'" alt="'+a.kind+'缩略图：'+a.name+'" style="object-position:'+a.pos+'" class="'+(a.zoom?'zoom':'')+'" loading="lazy" />')
          +   '<button class="cbx" data-sel="'+a.id+'" title="Select">'+icon('check',11)+'</button>'
          +   '<span class="play-hover"><span>'+icon('play',18)+'</span></span>'
          +   '<span class="cmt">'+icon('msg',12)+a.comments+'</span>'
          +   '<span class="badges"><span class="bdg">'+a.kind+'</span><span class="bdg">'+(a.used==='all'?'全片通用':(a.used?'用在 '+a.used+' 处':'未使用'))+'</span></span>'
          + '</div>'
          + '<div class="fname-row"><div class="fname" title="'+a.name+'">'+a.name+'</div>'
          +   '<button class="dots" title="More actions">'+icon('dots',16)+'</button></div>'
          + '<div class="fmeta">'+a.source+' &nbsp;·&nbsp; '+a.license+'</div>'
          + '<div class="field"><div class="flabel">'+icon('status',13)+'许可</div><div class="val">'+pillHTML(a.status)+'</div></div>'
          + '<div class="field"><div class="flabel">'+icon('user',13)+'来源</div><div class="val">'
          +   '<span class="chip">'+a.source+'</span>'
          + '</div></div>'
          + '</article>';
      }
      function srcHTML(key){
        var srcs = ASSETS.filter(function(a){ return a.status===key; }).map(function(a){ return a.source; });
        var uniq = srcs.filter(function(s, i){ return srcs.indexOf(s)===i; });
        return uniq.length===1 ? uniq[0] : (uniq.length + ' 个来源');
      }
      function groupHTML(key, label){
        var items = ASSETS.filter(function(a){ return a.status===key; });
        return '<section class="group" data-group="'+key+'">'
          + '<button class="group-head" data-toggle="'+key+'">'
          +   '<span class="chev">'+icon('chev-d',15)+'</span>'
          +   '<span class="g-label">许可</span>'
          +   '<span class="g-value '+key+'">'+label+'</span>'
          +   '<span class="swap">'+icon('swap',13)+'</span>'
          +   '<span class="g-label">来源</span>'
          +   '<span class="chip">'+srcHTML(key)+'</span>'
          + '</button>'
          + '<div class="grid">'+ items.map(cardHTML).join('') +'</div>'
          + '</section>';
      }
      var content = document.getElementById('content');
      function render(){
        content.innerHTML = groupHTML('attn','需署名') + groupHTML('ok','可商用') + groupHTML('blocked','不可商用');
        bindCards();
        updateStatusbar();
      }
      function updateStatusbar(){
        var n = Object.keys(selected).length;
        document.getElementById('statusbar').textContent = n ? ('已选 ' + n + ' · ' + ASSETS.length + ' 项素材') : (ASSETS.length + ' 项素材');
      }
      function bindCards(){
        content.querySelectorAll('[data-open]').forEach(function(el){
          el.addEventListener('click', function(){ openPlayer(+el.getAttribute('data-open')); });
          el.addEventListener('keydown', function(e){
            if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openPlayer(+el.getAttribute('data-open')); }
          });
        });
        content.querySelectorAll('[data-sel]').forEach(function(el){
          el.addEventListener('click', function(e){
            e.stopPropagation();
            var id = el.getAttribute('data-sel');
            if(selected[id]) delete selected[id]; else selected[id] = true;
            el.closest('.card').classList.toggle('selected');
            updateStatusbar();
          });
        });
        content.querySelectorAll('[data-toggle]').forEach(function(el){
          el.addEventListener('click', function(){
            el.closest('.group').classList.toggle('closed');
          });
        });
      }
      render();

      /* toast */
      var toastEl = document.getElementById('toast'), toastTimer;
      function toast(msg){
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
      }
      document.querySelector('[data-team]').addEventListener('click', function(){ toast('素材台账 · 11 项：需署名 5 · 可商用 5 · 不可商用 1'); });
      document.querySelector('[data-copy]').addEventListener('click', function(){
        var rows = ASSETS.map(function(a){ return [a.name, a.kind, a.source, a.license, a.used==='all'?'全片通用':(a.used?('用在 '+a.used+' 处'):'未使用')].join('\t'); });
        navigator.clipboard.writeText('素材名称\t类型\t来源\t许可\t使用情况\n' + rows.join('\n')).then(function(){
          toast('已复制 ' + ASSETS.length + ' 行素材清单到剪贴板');
        }, function(){ toast('复制失败：浏览器没有给剪贴板权限'); });
      });

      /* ================= player (Remotion-style monitor) ================= */
      var overlay = document.getElementById('overlay');
      var canvas = document.getElementById('stageCanvas');
      var ctx = canvas.getContext('2d');
      var bigPlay = document.getElementById('bigPlay');
      var playBtn = document.getElementById('playBtn');
      var cur = null, playing = false, t = 0, lastTs = 0, raf = null, imgObj = new Image();

      function tc(sec){
        var f = Math.floor((sec % 1) * 30);
        var s = Math.floor(sec) % 60, m = Math.floor(sec / 60) % 60, h = Math.floor(sec / 3600);
        function p(n){ return String(n).padStart(2,'0'); }
        return p(h)+':'+p(m)+':'+p(s)+':'+p(f);
      }
      function draw(){
        if(!cur || !imgObj.complete || !imgObj.naturalWidth) return;
        var W = canvas.width, H = canvas.height;
        var progress = cur.dur ? t / cur.dur : 0;
        var scale = 1.06 + progress * 0.1;
        var iw = imgObj.naturalWidth, ih = imgObj.naturalHeight;
        var base = Math.max(W / iw, H / ih);
        var dw = iw * base * scale, dh = ih * base * scale;
        var px = parseFloat((cur.pos || '50% 50%').split(' ')[0]) / 100;
        var py = parseFloat((cur.pos || '50% 50%').split(' ')[1]) / 100;
        var dx = (W - dw) * px - progress * 14;
        var dy = (H - dh) * py;
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
        ctx.drawImage(imgObj, dx, dy, dw, dh);
        var g = ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,'rgba(0,0,0,0.06)'); g.addColorStop(1,'rgba(0,0,0,0.16)');
        ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
      }
      function syncUI(){
        if(!cur) return;
        var pct = cur.dur ? (t / cur.dur) * 100 : 0;
        document.getElementById('pFill').style.width = pct + '%';
        document.getElementById('pKnob').style.left = pct + '%';
        document.getElementById('tcCur').textContent = tc(t);
        document.getElementById('tcBurn').textContent = tc(t);
        playBtn.innerHTML = icon(playing ? 'pause' : 'play', 15);
        bigPlay.style.display = playing ? 'none' : 'flex';
      }
      function loop(ts){
        if(!playing) return;
        if(!lastTs) lastTs = ts;
        var dt = (ts - lastTs) / 1000; lastTs = ts;
        t += dt;
        if(t >= cur.dur){ t = cur.dur; playing = false; }
        draw(); syncUI();
        if(playing) raf = requestAnimationFrame(loop);
      }
      function setPlaying(v){
        playing = v; lastTs = 0;
        if(playing){ if(t >= cur.dur) t = 0; raf = requestAnimationFrame(loop); }
        else if(raf) cancelAnimationFrame(raf);
        draw(); syncUI();
      }
      function openPlayer(id){
        cur = ASSETS.find(function(a){ return a.id === id; });
        if(!cur) return;
        if(cur.font){ toast('字体素材以字样预览，没有可播放画面'); return; }
        t = 0; playing = false;
        document.getElementById('pName').textContent = cur.name;
        document.getElementById('pSub').textContent = cur.source + ' · ' + cur.license;
        document.getElementById('tcDur').textContent = tc(cur.dur);
        document.getElementById('pStatus').innerHTML = pillHTML(cur.status);
        document.getElementById('pMeta').innerHTML =
          '<b>类型</b> · ' + cur.kind + '<br><b>来源</b> · ' + cur.source + '<br><b>许可</b> · ' + cur.license;
        var list = '';
        for(var i = 0; i < cur.comments; i++){
          var c = COMMENT_POOL[(cur.id + i) % COMMENT_POOL.length];
          var at = Math.min(cur.dur - 1, Math.floor((i + 1) * cur.dur / (cur.comments + 1)));
          list += '<div class="comment"><span class="avatar '+c[2]+'">'+c[1]+'</span><div>'
            + '<span class="cname">'+c[0]+'</span><span class="ctc">'+tc(at)+'</span>'
            + '<div class="ctext">'+c[3]+'</div></div></div>';
        }
        document.getElementById('cTitle').textContent = 'Comments · ' + cur.comments;
        document.getElementById('cList').innerHTML = list || '<div class="ctext">No comments yet.</div>';
        imgObj = new Image();
        imgObj.onload = function(){ draw(); };
        imgObj.src = cur.img;
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
        draw(); syncUI();
      }
      function closePlayer(){
        setPlaying(false);
        overlay.classList.remove('open');
        document.body.style.overflow = '';
      }
      playBtn.addEventListener('click', function(){ setPlaying(!playing); });
      bigPlay.addEventListener('click', function(){ setPlaying(true); });
      canvas.addEventListener('click', function(){ setPlaying(!playing); });
      document.getElementById('restartBtn').addEventListener('click', function(){ t = 0; draw(); syncUI(); });
      document.getElementById('pClose').addEventListener('click', closePlayer);
      overlay.addEventListener('click', function(e){ if(e.target === overlay) closePlayer(); });
      document.addEventListener('keydown', function(e){
        if(!overlay.classList.contains('open')) return;
        if(e.key === 'Escape') closePlayer();
        if(e.key === ' '){ e.preventDefault(); setPlaying(!playing); }
      });
      document.getElementById('progress').addEventListener('click', function(e){
        if(!cur) return;
        var r = this.getBoundingClientRect();
        var ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        t = ratio * cur.dur; draw(); syncUI();
      });
      function setStatus(st){
        if(!cur || cur.status === st) return;
        cur.status = st;
        document.getElementById('pStatus').innerHTML = pillHTML(st);
        render();
        toast(cur.name + (st === 'approved' ? ' approved' : ' moved back to Needs Review'));
      }
      document.getElementById('approveBtn').addEventListener('click', function(){ setStatus('approved'); });
      document.getElementById('reviewBtn').addEventListener('click', function(){ setStatus('review'); });
    </script>
  </body>
</html>
