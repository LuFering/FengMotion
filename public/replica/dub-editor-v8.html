(function () {
  var name = new URLSearchParams(location.search).get('project') || 'FengMotion';
  var DIFF = "{name} · 时序差异清单\n成片 152.0s · 25 段剪辑；V3 脚本 73 段 · 253.2s\n空档 2 处：53.0–56.0s(3.0s)、70.5–74.4s(3.9s)\n重叠 1 处：s04×s05 20.2–21.0s(0.8s)\n口播会超（按 4.5 字/秒）55 段：段 1、3、4、6、7、8、9、10、11、12、13、15、16、19、22、25、26、27、28、29、31、32、33、34、35、36、37、38、40、41、42、43、45、46、47、48、49、50、52、53、55、56、57、58、59、61、62、63、64、66、67、68、69、70、71";
  function applyName() {
    var spans = document.querySelectorAll('header span');
    for (var i = 0; i < spans.length; i++) {
      var c = spans[i].className || '';
      if (c.indexOf('max-w-36') !== -1) {
        if (spans[i].textContent !== name) { spans[i].textContent = name; spans[i].title = name; }
        return;
      }
    }
  }
  function grey(el, why) {
    if (!el || el.dataset.fmGrey) return;
    el.dataset.fmGrey = '1'; el.title = why; el.style.opacity = '.4';
    if (el.tagName === 'BUTTON' || el.tagName === 'INPUT') el.disabled = true;
  }
  function q(aria, root) { return (root || document).querySelector('[aria-label="' + aria + '"]'); }
  function wire() {
    applyName();
    var NOT_AVAIL = '未接入：当前版本只做时序校验';
    document.querySelectorAll('header nav button').forEach(function (b) { grey(b, NOT_AVAIL); });
    document.querySelectorAll('header button').forEach(function (b) {
      var t = (b.textContent || '').trim();
      if (t === 'English' || t === 'Korean') grey(b, '未接入：脚本语言为中文（旁白无配音）');
    });
    ['Add', 'Volume', 'Settings', 'Enhance'].forEach(function (a) { grey(q(a, document.querySelector('header')), NOT_AVAIL); });
    ['Captions', 'Fullscreen'].forEach(function (a) { grey(q(a), NOT_AVAIL); });
    ['Add clip', 'Split', 'Auto', 'Frame'].forEach(function (a) { grey(q(a), NOT_AVAIL); });
    ['Undo', 'Redo'].forEach(function (a) { grey(q(a), '本页只读：没有可撤销的操作'); });
    ['Media', 'Comments', 'Zoom', 'Level'].forEach(function (a) { grey(q(a), NOT_AVAIL); });
    var back = q('Back');
    if (back && !back.dataset.fmWire) {
      back.dataset.fmWire = '1';
      back.addEventListener('click', function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        try { window.parent.postMessage({ type: 'fm-audio-back' }, '*'); } catch (e) {}
      });
    }
    var fix = null;
    document.querySelectorAll('button').forEach(function (b) { if (!fix && (b.textContent || '').indexOf('定位第一处空档') !== -1) fix = b; });
    if (fix && !fix.dataset.fmWire) {
      fix.dataset.fmWire = '1';
      fix.addEventListener('click', function () {
        var m = window.__fmMonitor; if (m) { m.seek(53); }
      });
    }
    var dl = null;
    document.querySelectorAll('button').forEach(function (b) { if (!dl && (b.textContent || '').indexOf('复制差异清单') !== -1) dl = b; });
    if (dl && !dl.dataset.fmWire) {
      dl.dataset.fmWire = '1';
      dl.addEventListener('click', function () {
        try { navigator.clipboard.writeText(DIFF.replace('{name}', name)); } catch (e) {}
      });
    }
  }
  wire();
  setTimeout(wire, 400); setTimeout(wire, 1500);
  new MutationObserver(function () { requestAnimationFrame(wire); })
    .observe(document.body, { childList: true, subtree: true });
})();
</script>
</body>
</html>
