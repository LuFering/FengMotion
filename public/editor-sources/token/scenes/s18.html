<!doctype html>
<html lang="zh" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>镜 18 · 循环转起来</title>
    <script src="../gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      @font-face { font-family: "Noto Sans SC"; font-weight: 900;
        src: url("../assets/fonts/noto-sans-sc-900.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500;
        src: url("../assets/fonts/plex-mono-500.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "Big Shoulders Display"; font-weight: 800;
        src: url("../assets/fonts/big-shoulders-800.woff2") format("woff2"); font-display: block; }

      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #space {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 126% 84% at 50% 48%,
          #1e232c 0%, #161a21 44%, #0e1115 76%, #08090c 100%);
      }
      /* 加速时环境也跟着亮起来（能量在涨） */
      #glow {
        position: absolute; inset: 0; opacity: 0;
        background: radial-gradient(ellipse 52% 40% at 50% 52%,
          rgba(255,226,180,0.16) 0%, rgba(255,210,150,0.05) 42%, rgba(0,0,0,0) 74%);
      }

      #stage { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 48%; }
      #camera { position: absolute; inset: 0; transform-style: preserve-3d; }
      #loop { position: absolute; inset: 0; }
      #loopSvg { position: absolute; inset: 0; overflow: visible; }
      #loopSvg path {
        fill: none; stroke-width: 3; stroke-linecap: round;
      }
      #p1 { stroke: rgba(214,228,255,0.42); }
      #p2 { stroke: rgba(255,214,160,0.42); }
      #p3 { stroke: rgba(180,215,255,0.42); }

      .node {
        position: absolute; left: 0; top: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        border-radius: 22px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 26px 60px rgba(0,0,0,0.66);
        will-change: transform;
      }
      .node .t { font-family: "Noto Sans SC", sans-serif; font-weight: 900;
        font-size: 40px; color: #f2f3f5; white-space: nowrap; }
      .node .c { font-family: "IBM Plex Mono", monospace; font-weight: 500;
        font-size: 15px; letter-spacing: 0.26em; color: #9aa3b2; margin-top: 10px; white-space: nowrap; }
      #nToken {
        width: 300px; height: 300px; margin-left: -150px; margin-top: -150px;
        border-radius: 50%;
        background: radial-gradient(circle at 42% 36%, #3a4250 0%, #222833 52%, #12161c 100%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 32px 80px rgba(0,0,0,0.72);
      }
      #nToken .t {
        font-family: "Big Shoulders Display", sans-serif; font-weight: 800;
        font-size: 86px; letter-spacing: 0.01em;
        background: linear-gradient(180deg, #fff 0%, #f2efe9 40%, #cfcac1 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }
      #nCompute { width: 400px; height: 220px; margin-left: -200px; margin-top: -110px;
        background: linear-gradient(158deg, #4a5568 0%, #2b3340 56%, #1a1f27 100%); }
      #nProduce { width: 400px; height: 220px; margin-left: -200px; margin-top: -110px;
        background: linear-gradient(158deg, #6b5f4a 0%, #3f392c 56%, #25221a 100%); }

      .tension {
        position: absolute; left: 0; top: 0; width: 32px; height: 32px;
        border-radius: 50%;
        background: radial-gradient(circle at 44% 40%, #fff 0%, #ffe6c2 48%, #b8a06a 100%);
        box-shadow: 0 0 24px rgba(255,226,180,0.7);
      }
      /* 加速时节点上的"被拉动"环 */
      .halo {
        position: absolute; left: 50%; top: 50%;
        border-radius: 50%; pointer-events: none; opacity: 0;
        box-shadow: 0 0 0 2px rgba(255,226,180,0.42);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s18" data-start="0" data-duration="8.0"
         data-width="1920" data-height="1080">
      <div id="space" class="clip" data-start="0" data-duration="8.0" data-track-index="0"></div>
      <div id="glow"  class="clip" data-start="0" data-duration="8.0" data-track-index="1"></div>
      <div id="stage" class="clip" data-start="0" data-duration="8.0" data-track-index="2">
        <div id="camera">
          <div id="loop">
            <svg id="loopSvg" viewBox="0 0 1920 1080" width="1920" height="1080">
              <path id="p1" d="" /><path id="p2" d="" /><path id="p3" d="" />
            </svg>
          </div>
          <div class="node" id="nCompute"><div class="t">算力</div><div class="c">COMPUTE</div></div>
          <div class="node" id="nProduce"><div class="t">生产力</div><div class="c">PRODUCTIVITY</div></div>
          <div class="node" id="nToken"><div class="t">Token</div></div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const CX = 960, CY = 540, R = 330;
      const P = {
        token:   { x: CX,     y: CY + 210 },
        compute: { x: CX - R, y: CY - 130 },
        produce: { x: CX + R, y: CY - 130 },
      };
      gsap.set('#nToken',   { x: P.token.x,   y: P.token.y });
      gsap.set('#nCompute', { x: P.compute.x, y: P.compute.y });
      gsap.set('#nProduce', { x: P.produce.x, y: P.produce.y });

      function edge(a, b, bulge, id) {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
        const cx = mx + (-dy / L) * bulge, cy = my + (dx / L) * bulge;
        document.getElementById(id).setAttribute('d', `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`);
        return { id, a, b };
      }
      const EDGES = [
        edge(P.compute, P.produce, -110, 'p1'),
        edge(P.produce, P.token,   -120, 'p2'),
        edge(P.token,   P.compute, -120, 'p3'),
      ];
      EDGES.forEach((e) => { e.el = document.getElementById(e.id); e.len = e.el.getTotalLength(); });

      // ── 时间表（30fps）—— 全片最高能量点 ────────────────────────
      //  0.00–0.50  承 s17：同一个循环（元素继承，不清屏）
      //  0.50–3.60  循环**加速**：张力包一圈比一圈快、一圈比一圈亮
      //  2.00–4.20  节点被"拉动"（微微前倾/侧移，像被力拽）
      //  3.60–5.20  能量涨到顶：环境光升起、笔画变亮变粗
      //  5.20–6.40  最高点 hold（这是全片的能量峰值）
      //  6.40–8.00  开始回落（给 s19 的"急停"留落差）
      const T_SPIN  = 0.50;
      const T_PULL  = 2.00;
      const T_PEAK  = 3.60;
      const T_HOLD  = 5.20;
      const T_FALL  = 6.40;

      // ① 张力包：**一圈比一圈快**（间隔收缩 —— 判例 R2：速度感来自加速度）
      const tensions = [];
      EDGES.forEach((e, i) => {
        for (let k = 0; k < 3; k++) {
          const el = document.createElement('div');
          el.className = 'tension';
          el.setAttribute('data-layout-ignore', '');
          document.getElementById('loop').appendChild(el);
          gsap.set(el, { opacity: 0 });
          tensions.push({ el, edge: e, phase: (i * 0.13 + k * 0.33) % 1 });
        }
      });
      // 三轮，每轮周期递减：1.5s → 0.95s → 0.55s
      const ROUNDS = [
        { dur: 1.50, at: T_SPIN },
        { dur: 0.95, at: T_SPIN + 1.60 },
        { dur: 0.55, at: T_SPIN + 2.70 },
      ];
      ROUNDS.forEach((r, ri) => {
        tensions.forEach((t) => {
          const st = { p: t.phase };
          tl.to(t.el, { opacity: 0.35 + ri * 0.22, duration: 0.20, ease: 'none' }, r.at);
          tl.to(st, {
            p: t.phase + 1, duration: r.dur, ease: 'none',
            onUpdate: () => {
              const f = st.p % 1;
              const pt = t.edge.el.getPointAtLength(t.edge.len * f);
              gsap.set(t.el, { x: pt.x, y: pt.y });
            },
          }, r.at);
        });
      });
      // 之后持续快转（最高点）
      tensions.forEach((t) => {
        const st = { p: t.phase };
        tl.to(st, {
          p: t.phase + 6, duration: 2.60, ease: 'none',
          onUpdate: () => {
            const f = st.p % 1;
            const pt = t.edge.el.getPointAtLength(t.edge.len * f);
            gsap.set(t.el, { x: pt.x, y: pt.y });
          },
        }, T_PEAK);
      });

      // ② 节点被"拉动"（不是静止的图）
      tl.to('#nCompute', { x: P.compute.x + 34, y: P.compute.y + 14, rotate: 2.4,
                           duration: 0.55, ease: 'power2.inOut' }, T_PULL);
      tl.to('#nProduce', { x: P.produce.x - 34, y: P.produce.y + 14, rotate: -2.4,
                           duration: 0.55, ease: 'power2.inOut' }, T_PULL + 0.10);
      tl.to('#nToken',   { scale: 1.06, duration: 0.60, ease: 'power2.inOut' }, T_PULL + 0.20);
      // 抖动（高频小幅，读作"被拽紧"）—— 用有限次数
      tl.to('#nCompute', { x: P.compute.x + 22, duration: 0.14, ease: 'sine.inOut', yoyo: true, repeat: 7 }, T_PULL + 0.60);
      tl.to('#nProduce', { x: P.produce.x - 22, duration: 0.14, ease: 'sine.inOut', yoyo: true, repeat: 7 }, T_PULL + 0.68);

      // ③ 能量涨到顶
      tl.to('#glow', { opacity: 1, duration: 1.40, ease: 'power2.in' }, T_PEAK);
      tl.to('#loopSvg path', { strokeWidth: 5.5, duration: 0.90, ease: 'power2.in' }, T_PEAK + 0.30);
      tl.to('#nToken', { scale: 1.10, duration: 0.90, ease: 'power2.in' }, T_PEAK + 0.30);

      // ④ 最高点 hold
      tl.to('#glow', { opacity: 0.86, duration: 0.70, ease: 'sine.inOut' }, T_HOLD);
      tl.to('#glow', { opacity: 1.0,  duration: 0.70, ease: 'sine.inOut' }, T_HOLD + 0.80);

      // ⑤ 回落（给 s19 急停留落差）
      tl.to('#glow', { opacity: 0.42, duration: 1.20, ease: 'power2.out' }, T_FALL);
      tl.to('#nToken', { scale: 1.0, duration: 1.10, ease: 'power2.out' }, T_FALL);
      tl.to('#loopSvg path', { strokeWidth: 3, duration: 1.10, ease: 'power2.out' }, T_FALL);

      window.__timelines['s18'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
