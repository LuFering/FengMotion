<!doctype html>
<html lang="zh" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>镜 20 · 三块钱</title>
    <script src="../gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      @font-face { font-family: "Noto Sans SC"; font-weight: 900;
        src: url("../assets/fonts/noto-sans-sc-900.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500;
        src: url("../assets/fonts/plex-mono-500.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "Big Shoulders Display"; font-weight: 800;
        src: url("../assets/fonts/big-shoulders-800.woff2") format("woff2"); font-display: block; }

      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #space {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 120% 80% at 50% 46%,
          #1c212a 0%, #151920 44%, #0d1014 76%, #08090c 100%);
      }
      #lightpool {
        position: absolute; left: 50%; top: -24%;
        width: 1400px; height: 820px; margin-left: -700px;
        background: radial-gradient(ellipse 50% 50% at 50% 50%,
          rgba(255,226,180,0.10) 0%, rgba(255,210,150,0.035) 40%, rgba(0,0,0,0) 74%);
      }
      #stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 50% 50%; }
      #camera { position: absolute; inset: 0; transform-style: preserve-3d; }

      /* ── 价格牌：一块实体面板，不是飘着的字 ───────────────────── */
      #plate {
        position: absolute; left: 50%; top: 50%;
        width: 1180px; height: 460px;
        margin-left: -590px; margin-top: -230px;
        border-radius: 18px;
        background: linear-gradient(158deg, rgba(255,255,255,0.075) 0%, rgba(255,255,255,0.022) 52%, rgba(0,0,0,0.18) 100%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 44px 110px rgba(0,0,0,0.68);
        opacity: 0;
      }
      #plateLine {
        position: absolute; left: 0; right: 0; top: 0; height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(255,226,180,0) 0%, rgba(255,226,180,0.75) 50%, rgba(255,226,180,0) 100%);
      }
      /* 左侧：单价 */
      #priceCap {
        position: absolute; left: 72px; top: 70px;
        font-family: "IBM Plex Mono", monospace; font-weight: 500;
        font-size: 20px; letter-spacing: 0.30em; color: #9aa3b2;
      }
      #priceRow {
        position: absolute; left: 68px; top: 128px;
        display: flex; align-items: baseline; gap: 10px;
      }
      #yen {
        font-family: "Noto Sans SC", "Big Shoulders Display", sans-serif;
        font-weight: 900; font-size: 140px; line-height: 0.82;   /* 收紧行盒，避免压到下方标签 */
        color: #e8e4dc;
      }
      #num {
        font-family: "Big Shoulders Display", sans-serif; font-weight: 800;
        font-size: 240px; line-height: 0.86; letter-spacing: 0.01em;
        background: linear-gradient(180deg, #fffaf0 0%, #f0e6d2 40%, #c8b795 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }
      /* 右侧：计量单位 */
      #unitCap {
        position: absolute; right: 72px; top: 70px; text-align: right; width: 420px;
        font-family: "IBM Plex Mono", monospace; font-weight: 500;
        font-size: 20px; letter-spacing: 0.30em; color: #9aa3b2;
      }
      #unitRow {
        position: absolute; right: 68px; top: 150px;
        display: flex; align-items: baseline; gap: 14px;
      }
      #unitNum {
        font-family: "Big Shoulders Display", sans-serif; font-weight: 800;
        font-size: 118px; line-height: 0.9; color: #dfe4ec;
      }
      #unitName {
        font-family: "IBM Plex Mono", monospace; font-weight: 500;
        font-size: 34px; letter-spacing: 0.10em; color: #aab2c0;
      }
      /* 底面：一排小币，读作"百万"的量级 */
      #coinRow {
        position: absolute; left: 72px; right: 72px; bottom: 62px; height: 46px;
        display: flex; gap: 14px; align-items: center;
      }
      .mini {
        width: 46px; height: 46px; border-radius: 50%;
        background: radial-gradient(circle at 40% 34%, #fffaf0 0%, #e8dcc4 42%, #a89370 100%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 6px 14px rgba(0,0,0,0.5);
        opacity: 0;
      }
      #coinMore {
        font-family: "IBM Plex Mono", monospace; font-weight: 500;
        font-size: 24px; letter-spacing: 0.16em; color: #8b93a1; opacity: 0;
      }
      #modelTag {
        position: absolute; right: 68px; top: 300px; text-align: right; width: 520px;
        font-family: "IBM Plex Mono", monospace; font-weight: 500;
        font-size: 21px; letter-spacing: 0.22em; color: #c9b89e; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s20" data-start="0" data-duration="6.6"
         data-width="1920" data-height="1080">
      <div id="space" class="clip" data-start="0" data-duration="6.6" data-track-index="0"></div>
      <div id="lightpool" class="clip" data-start="0" data-duration="6.6" data-track-index="1" data-layout-allow-overflow></div>
      <div id="stage" class="clip" data-start="0" data-duration="6.6" data-track-index="2">
        <div id="camera">
          <div id="plate">
            <div id="plateLine"></div>
            <div id="priceCap">单价 · INPUT</div>
            <div id="priceRow"><div id="yen">¥</div><div id="num">3</div></div>
            <div id="unitCap">计量单位</div>
            <div id="unitRow"><div id="unitNum">1,000,000</div><div id="unitName">token</div></div>
            <div id="modelTag">V4.1 FLASH · DEEPSEEK</div>
            <div id="coinRow"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 一排小币（10 枚）+ "…" 表示还有很多
      const row = document.getElementById('coinRow');
      const minis = [];
      for (let i = 0; i < 10; i++) {
        const el = document.createElement('div');
        el.className = 'mini';
        el.setAttribute('data-layout-ignore', '');
        row.appendChild(el);
        minis.push(el);
      }
      const more = document.createElement('div');
      more.id = 'coinMore'; more.textContent = '……';
      more.setAttribute('data-layout-ignore', '');
      row.appendChild(more);

      // 承 s19 末态：币被捧住 → 本镜它变成"计价单位"
      gsap.set('#plate', { scale: 0.94 });
      gsap.set('#num', { y: -70, opacity: 0 });
      gsap.set('#unitNum', { opacity: 0 });

      // ── 时间表（30fps）──────────────────────────────────────────
      //  0.00–0.55  承 s19：那枚币放大成一块价格牌（元素继承）
      //  0.55–1.05  面板成形，顶部亮线抽出
      //  1.05–1.75  ¥3 落定（数字有重量）
      //  1.75–2.45  右侧计量单位落定（1,000,000 token）
      //  2.45–3.10  底部小币排开（"百万"的量级）
      //  3.10–4.20  型号标签落定
      //  4.20–6.60  稳定 hold（价格牌要"被看清"）
      const T_PLATE = 0.00;
      const T_LINE  = 0.55;
      const T_PRICE = 1.05;
      const T_UNIT  = 1.75;
      const T_COINS = 2.45;
      const T_TAG   = 3.10;
      const T_HOLD  = 4.20;

      // ① 面板从"币"放大成形
      tl.to('#plate', { opacity: 1, scale: 1, duration: 0.72, ease: 'power3.out' }, T_PLATE);

      // ② 顶部亮线抽出（沿用片头的手法，保持全片语言一致）
      tl.fromTo('#plateLine', { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, transformOrigin: '50% 50%', duration: 0.42, ease: 'power3.out' }, T_LINE);

      // ③ ¥3 落定（带过冲）
      tl.to('#num', { y: 0, opacity: 1, duration: 0.55, ease: 'back.out(1.7)' }, T_PRICE);
      tl.fromTo('#priceCap', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.40, ease: 'power2.out' }, T_PRICE + 0.22);
      // ¥ 比数字晚半拍（先数后单位）
      tl.fromTo('#yen', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.42, ease: 'power2.out' }, T_PRICE + 0.34);

      // ④ 右侧单位
      tl.fromTo('#unitNum', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.50, ease: 'power3.out' }, T_UNIT);
      tl.fromTo('#unitRow', { opacity: 0 }, { opacity: 1, duration: 0.30, ease: 'none' }, T_UNIT);
      tl.fromTo('#unitCap', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.40, ease: 'power2.out' }, T_UNIT + 0.26);

      // ⑤ 底部小币排开（错峰，"百万"的量级）
      minis.forEach((m, i) => {
        tl.fromTo(m, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.34, ease: 'back.out(1.8)' }, T_COINS + i * 0.045);
      });
      tl.to('#coinMore', { opacity: 1, duration: 0.35, ease: 'power2.out' }, T_COINS + 0.52);

      // ⑥ 型号标签
      tl.fromTo('#modelTag', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, T_TAG);

      // ⑦ hold + 极轻呼吸
      tl.to('#plate', { scale: 1.014, duration: 1.30, ease: 'sine.inOut' }, T_HOLD);
      tl.to('#plate', { scale: 1.0,   duration: 1.30, ease: 'sine.inOut' }, T_HOLD + 1.40);

      window.__timelines['s20'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
