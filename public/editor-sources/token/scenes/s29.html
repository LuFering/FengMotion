         「绝大部分办公型 AI 都是免费的。免费就不跟你算账，不算账你就看不见。」
         旁白 62.68–68.12（5.44s）

         ══ 逐拍（按 5.15 字/秒 从旁白算出，不凭感觉）══

         63.90–65.15  都是免费的。          → 每个图标贴上一枚「免费」标
         65.15–66.20  免费就不跟你算账，    → 图标排满；底下那张账单**还在**
         66.20–68.12  不算账你就看不见。    → 账单**沉下去、退出画面**（看不见了）

         ══ 手法出处 ══
         · 参考视频拆解「规律 4：人名/公司名 → 图卡」
             卡原文：「提到哪个主体，就出哪个主体的图卡。」
             → 提到"办公型 AI"，就给**一排 AI 应用图标**。

         · 参考视频拆解「规律 1：凡是可以具象的词，都给实体画面」
             「免费」→ 真的给**营销标签**（真实世界里 App Store 就这么标的）。
             ⚠️ 用户确认过：这是**产品自己的营销标签**，不是旁白字幕。

         · shotcraft `icon-field-colorize`（图标点阵铺满）
             卡原文：「灰阶小图标点阵错峰浮现铺满全屏，停一拍后……
             品牌色横带波纹极快向下扫翻全场。」
             → 借它的"点阵错峰铺满"，但**不做彩色扫翻**
               （那是"功能全景点亮"的语义，跟本镜无关）。

         · 判例 R1「关键信息落定后必须呼吸」
             → 图标铺满后 hold，让"账单不见了"这件事被看清。

         ⚠️ 用户硬约束：**永远不要编造价格/费率/API 费用**
            → 「免费」标签是**状态**不是价格，不涉及费率，合规。
               （真实世界里各家 AI 应用确实都标着免费。）

         ══ 这一镜的语义（全段的落点）══
         前三镜：计量器（s26）→ 账单空着金额（s27）→ 纸盖住（s28）
         本镜：**一排免费标签铺满，账单沉下去。**
         「免费就不跟你算账」= 标签一个个贴上去；
         「不算账你就看不见」= 底下那张账单退出画面。
         两件事同时发生，因果就成立了 —— 不写因果链的箭头。

         ══ 接缝 ══
         入：承 s28 末态 —— 纸盖着账单，账单在画面右侧，计量器在左侧暗着。
         出：图标铺满全屏，账单已沉出画外。
             下一镜（段20「那它凭什么免费？」）从这片"免费"里起手。 -->

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ══ 滚轮数字带（与 s26–s28 同一套 BASE/STEP）══
      const tape = document.getElementById('tape');
      const N = 26, H = 190, BASE = 1204000, STEP = 40000;
      for (let i = 0; i < N; i++) {
        const t = document.createElement('div');
        t.className = 'tick';
        t.style.top = (i * H) + 'px';
        t.textContent = (BASE + i * STEP).toLocaleString('en-US');
        t.setAttribute('data-layout-ignore', '');
        tape.appendChild(t);
      }
      tape.style.height = (N * H) + 'px';

      // ══ ⭐ 那一排应用图标（**App Store 官方 512px 图标**）══
      // 图标取自 App Store（../assets/apps/SOURCES.md 有来源）。
      // ⚠️ 豆包放在**第一排第一个**：它是下一镜（彩蛋）的主角，
      //    位置要先立住，观众的眼睛已经在那儿了。
      const APPS = [
        { x:  210, y: 250, icon: 'doubao.png',   name: '豆包' },
        { x:  540, y: 250, icon: 'qwen.png',     name: '通义千问' },
        { x:  870, y: 250, icon: 'deepseek.png', name: 'DeepSeek' },
        { x: 1200, y: 250, icon: 'zhipu.png',    name: '智谱清言' },
        { x:  210, y: 620, icon: 'kimi.png',     name: 'Kimi' },
        { x:  540, y: 620, icon: 'yuanbao.png',  name: '腾讯元宝' },
        { x:  870, y: 620, icon: 'spark.png',    name: '讯飞星火' },
        { x: 1200, y: 620, icon: 'wenxin.png',   name: '文心一言' },
      ];
      const appsBox = document.getElementById('appsHost');
      const appEls = [], tagEls = [];
      APPS.forEach((a) => {
        const el = document.createElement('div');
        el.className = 'app';
        el.style.left = a.x + 'px';
        el.style.top = a.y + 'px';
        // ⭐ 真实图标（App Store 512px，自带圆角底色 —— 不再套品牌色底）
        const img = document.createElement('img');
        img.src = '../assets/apps/' + a.icon;
        img.alt = '';
        img.setAttribute('data-layout-ignore', '');
        el.appendChild(img);
        el.setAttribute('data-layout-ignore', '');
        appsBox.appendChild(el);
        appEls.push(el);

        const nm = document.createElement('div');
        nm.className = 'appName';
        nm.textContent = a.name;
        nm.style.left = (a.x - 40) + 'px';
        nm.style.width = '248px';
        nm.style.top = (a.y + 184) + 'px';
        nm.setAttribute('data-layout-ignore', '');
        appsBox.appendChild(nm);

        // 「免费」标签贴在图标右上角
        const tag = document.createElement('div');
        tag.className = 'freeTag';
        tag.textContent = '免费';
        tag.style.left = (a.x + 92) + 'px';
        tag.style.top = (a.y - 18) + 'px';
        tag.setAttribute('data-layout-ignore', '');
        appsBox.appendChild(tag);
        tagEls.push(tag);
      });

      // ══ 初始态：**承 s28 末态**（不重画、不复位）══
      gsap.set('#stage', { scale: 0.62, x: -150, y: -50, transformOrigin: '50% 50%', opacity: 0.40 });
      gsap.set('#tape', { y: -19 * H });          // 1,964,000（s28 的落点）
      gsap.set('#shroudL', { x: 920 });
      gsap.set('#shroudR', { x: 1580 });
      gsap.set('#sheet', { scaleY: 1, transformOrigin: '50% 0%' });
      gsap.set(appEls, { opacity: 0, scale: 0.86 });
      gsap.set(tagEls, { opacity: 0, scale: 0.80 });

      // ══ 时间表（5.74s）—— 逐拍对齐旁白 ════════════════════════
      //  0.00–1.22  绝大部分办公型 AI    → 图标**逐个亮起**（错峰铺满）
      //  1.22–2.47  都是免费的。         → 每个图标贴上一枚「免费」标
      //  2.47–3.52  免费就不跟你算账，   → 图标排满、停一拍
      //  3.52–5.44  不算账你就看不见。   → 底下那张账单**沉下去、退出画面**
      //  5.44–5.74  段尾停顿（呼吸）
      const T_APPS = 0.00;
      const T_FREE = 1.22;
      const T_SINK = 3.52;
      const T_HOLD = 5.44;

      // ① 图标逐个亮起（错峰 0.11s —— `icon-field-colorize` 的点阵铺满）
      appEls.forEach((el, i) => {
        tl.to(el, { opacity: 1, scale: 1, duration: 0.46, ease: 'power3.out' },
          T_APPS + i * 0.11);
      });

      // ② 每个图标贴上一枚「免费」标（跟着图标走，错峰 0.09s）
      tagEls.forEach((el, i) => {
        tl.to(el, { opacity: 1, scale: 1, duration: 0.40, ease: 'back.out(1.6)' },
          T_FREE + i * 0.09);
      });

      // ③ 计量器继续暗下去（它已经退场了）
      tl.to('#stage', { opacity: 0.16, duration: 1.20, ease: 'power2.inOut' }, T_FREE);

      // ④ ⭐ 落点：**账单沉下去、退出画面** —— 「不算账你就看不见」
      //    纸和账单一起往下走（它们是一体的），不是淡出
      //    （淡出读作"消失了"，沉下去读作"被推到看不见的地方"）
      tl.to('#billHost', { y: 1180, duration: 1.10, ease: 'power2.in' }, T_SINK);
      tl.to('#billHost', { opacity: 0, duration: 0.50, ease: 'power2.in' }, T_SINK + 0.70);

      // ⑤ 呼吸（判例 R1：关键信息落定后必须停）
      tl.to('#appsHost', { scale: 1.014, duration: 1.10, ease: 'sine.inOut' }, T_HOLD);
      tl.to('#appsHost', { scale: 1.000, duration: 1.10, ease: 'sine.inOut' }, T_HOLD + 1.20);

      window.__timelines['s29'] = tl;
    </script>
