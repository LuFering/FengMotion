<!doctype html>
<html lang="zh" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>镜 09 · 黄仁勋</title>
    <script src="../gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      @font-face { font-family: "Big Shoulders Display"; font-weight: 800;
        src: url("../assets/fonts/big-shoulders-800.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500;
        src: url("../assets/fonts/plex-mono-500.woff2") format("woff2"); font-display: block; }

      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* 从 s08 的黑场里"打开" —— 空间是同一个，只是灯重新亮了 */
      #space {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 100% 74% at 34% 46%,
          #23272f 0%, #191d23 44%, #0f1216 76%, #0a0b0e 100%);
        opacity: 0;
      }
      /* 底部台面：人物要有"站的地方" */
      #podium {
        position: absolute; left: 0; right: 0; bottom: 0; height: 32%;
        background: linear-gradient(180deg, rgba(255,255,255,0.045) 0%, rgba(255,255,255,0) 62%);
        opacity: 0;
      }
      #stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 40% 48%; }
      #camera { position: absolute; inset: 0; transform-style: preserve-3d; }

      /* 黄仁勋：真人影像占左侧 2/3，有真实厚度边 */
      #portrait {
        position: absolute; left: 150px; top: 90px;
        width: 660px; height: 900px;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 40px 100px rgba(0,0,0,0.75), inset 0 0 0 1px rgba(255,255,255,0.10);
        opacity: 0;
      }
      #portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
      /* 影像底部压暗，让字标区沉下去 */
      #portraitScrim {
        position: absolute; left: 150px; top: 90px; width: 660px; height: 900px;
        border-radius: 6px;
        background: linear-gradient(180deg, rgba(0,0,0,0) 58%, rgba(0,0,0,0.70) 100%);
        opacity: 0; pointer-events: none;
      }

      /* 右侧字标区 */
      #nvidia {
        position: absolute; left: 950px; top: 386px;
        font-family: "Big Shoulders Display", sans-serif; font-weight: 800;
        font-size: 132px; line-height: 1; letter-spacing: 0.02em;
        color: #f0f1f3;
        opacity: 0;
      }
      #name {
        position: absolute; left: 958px; top: 540px;
        font-family: "IBM Plex Mono", monospace; font-weight: 500;
        font-size: 26px; letter-spacing: 0.30em; color: #9aa1ad;
        opacity: 0;
      }
      #rule { position: absolute; left: 958px; top: 516px; height: 2px; width: 0;
        background: linear-gradient(90deg, #76b900 0%, rgba(118,185,0,0) 100%); opacity: 0; }

      /* 连接：Token → 人物（一条从左侧进人的细线） */
      #lead { position: absolute; left: 0; top: 0; height: 2px;
        background: linear-gradient(90deg, rgba(214,228,255,0) 0%, rgba(214,228,255,0.6) 60%, rgba(214,228,255,0) 100%);
        opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s09" data-start="0" data-duration="7.4"
         data-width="1920" data-height="1080">
      <div id="space"   class="clip" data-start="0" data-duration="7.4" data-track-index="0"></div>
      <div id="podium"  class="clip" data-start="0" data-duration="7.4" data-track-index="1"></div>

      <div id="stage" class="clip" data-start="0" data-duration="7.4" data-track-index="2">
        <div id="camera">
          <div id="lead"></div>
          <div id="portrait"><img src="../assets/people/jensen.jpg" alt="" /></div>
          <div id="portraitScrim"></div>
          <div id="rule"></div>
          <div id="nvidia">NVIDIA</div>
          <div id="name">JENSEN HUANG</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set('#portrait img', { scale: 1.14, xPercent: 0, yPercent: -4 });
      gsap.set('#lead', { x: -900, y: 470, width: 1100 });

      // ── 时间表（30fps）──────────────────────────────────────────
      //  0.00–0.55  从 s08 的黑场里"打开"（灯重新亮）
      //  0.55–1.70  黄仁勋从纵深远处进入并推近（他是空间里的核心节点）
      //  1.70–2.30  影像内的轻微推镜（人像自己也在动，不是贴图）
      //  2.30–3.00  NVIDIA 字标 + 绿色分隔线落定
      //  3.00–3.55  JENSEN HUANG 落定
      //  3.55–5.60  稳定 hold（人物要"被看清"）
      //  5.60–7.40  轻微横移 + 呼吸，交棒 s10
      const T_OPEN  = 0.00;
      const T_ENTER = 0.55;
      const T_MARK  = 2.30;
      const T_NAME  = 3.00;
      const T_HOLD  = 3.55;

      // ① 从黑场打开
      tl.to('#space',  { opacity: 1, duration: 0.75, ease: 'power2.out' }, T_OPEN + 0.10);
      tl.to('#podium', { opacity: 1, duration: 0.85, ease: 'power2.out' }, T_OPEN + 0.30);

      // ② 人物从纵深远处进入（z 是真实纵深，不是缩放）
      tl.set('#portrait', { opacity: 1 }, T_ENTER - 1/30);
      tl.fromTo('#portrait',
        { z: -1400, y: 60, scale: 0.92 },
        { z: -160, y: 0, scale: 1.0, duration: 1.15, ease: 'power3.out' },
        T_ENTER);
      tl.fromTo('#portraitScrim', { opacity: 0 }, { opacity: 1, duration: 0.70, ease: 'power2.out' }, T_ENTER + 0.40);

      // ③ 影像内的轻微推镜（人像"在动"）
      tl.to('#portrait img', { scale: 1.06, yPercent: -1, duration: 2.20, ease: 'sine.inOut' }, T_ENTER + 0.90);

      // ④ 字标落定（NVIDIA 有重量感）
      tl.to('#rule', { opacity: 1, width: 300, duration: 0.40, ease: 'power2.out' }, T_MARK - 0.15);
      tl.fromTo('#nvidia', { opacity: 0, y: 34 },
        { opacity: 1, y: 0, duration: 0.60, ease: 'power3.out' }, T_MARK);
      tl.fromTo('#name', { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.50, ease: 'power2.out' }, T_NAME);

      // ⑤ 一点"连接"暗示：Token 从左侧牵过来
      tl.fromTo('#lead', { opacity: 0 }, { opacity: 1, duration: 0.40, ease: 'power2.out' }, T_ENTER + 0.60);
      tl.to('#lead', { x: -1200, duration: 1.4, ease: 'power2.inOut' }, T_ENTER + 0.70);

      // ⑥ hold + 呼吸
      tl.to('#camera', { x: -70, duration: 1.90, ease: 'sine.inOut' }, T_HOLD);
      tl.to('#nvidia', { y: -8, duration: 1.20, ease: 'sine.inOut' }, T_HOLD + 0.30);
      tl.to('#nvidia', { y: 0,  duration: 1.10, ease: 'sine.inOut' }, T_HOLD + 1.55);

      window.__timelines['s09'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
