server:
  address: 127.0.0.1
  # 端口可由桌面壳通过 --server.port 覆盖：8080 被占用时壳会换一个空闲端口，
  # 再把它传给前端。硬编码会让「端口冲突」变成「应用打不开」。
  port: ${FENGMOTION_PORT:8080}

spring:
  application:
    name: fengmotion-server

  datasource:
    # 数据目录必须绝对且可写。
    # 打成桌面应用后「当前工作目录」由壳决定（可能是安装目录，通常只读），
    # 用相对路径会把数据库写到奇怪的地方甚至启动失败。
    # 默认放用户数据目录；壳会通过 --fengmotion.data-dir 指定具体位置。
    url: jdbc:sqlite:${fengmotion.data-dir:.}/fengmotion.db
    driver-class-name: org.sqlite.JDBC

  sql:
    init:
      mode: always

  # 附件上传体积上限。Spring 默认只有 1MB，素材截图稍大就会被容器层直接拒绝，
  # 而且报的是框架异常而不是我们自己的错误文案。这里与服务层 64MiB 保持一致，
  # 稍微放宽一点给 multipart 封装开销留余量。
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 68MB

fengmotion:
  # 数据根目录：数据库、附件都从这里派生。壳启动后端时会显式传入。
  # 默认数据根目录。
  #
  # 这里刻意与桌面应用的 userData 保持一致（Linux: ~/.config/FengMotion），
  # 而不是另建一个 ~/.fengmotion —— 两套路径会让「开发态」和「打包态」看到
  # 两份不同的数据：应用里打开项目报「项目不存在」，而开发态一切正常（真机踩过）。
  # 桌面壳启动时会显式传 --fengmotion.data-dir，值与此相同；
  # 单独跑 mvn spring-boot:run 时也落到同一处，两边数据自动一致。
  data-dir: ${user.home}/.config/FengMotion/data
  workspace-root: ${user.home}/FengMotion/projects
  # 附件落盘目录：与工作区（项目文件）分开，上传的是「为某条消息带上的临时文件」，
  # 不属于任何项目的资产树。
  # 从 data-dir 派生，保证「数据都在一个地方」，备份/迁移只需搬一个目录
  upload-root: ${fengmotion.data-dir}/uploads

  # Remotion 渲染（统一工程：所有项目共用一份依赖与管线，差异走 props）
  # 构建版本：由 pom 的 project.version 通过资源过滤注入，供 /health 返回。
  # 不写死在代码里 —— 否则改 pom 版本后接口仍报旧值，前端与更新器会被误导。
  build-version: '@project.version@'
  modify:
    # 修改方案由模型生成，单次生成超时
    plan-timeout-seconds: ${FENGMOTION_MODIFY_PLAN_TIMEOUT:90}
  remotion:
    # 工程目录：含 render.mjs 与 src/。留空时按 user.dir/remotion 推断（开发态）
    project-dir: ${FENGMOTION_REMOTION_DIR:}
    # 依赖目录：复用桌面端已装的 node_modules，不再单独装几百 MB
    node-modules: ${FENGMOTION_NODE_MODULES:}
    # Chromium 路径：留空则由 Remotion 自行下载 chrome-headless-shell
    browser: ${FENGMOTION_CHROME:/opt/google/chrome/chrome}
    node: ${FENGMOTION_NODE:/usr/bin/node}
    # 渲染超时：长片会更久
    timeout-seconds: 600
  cors:
    # Electron 壳以 fengmotion://app 为 origin，必须显式列入白名单；
    # 否则壳内所有 fetch 都会被 CORS 拦成 403。
    allowed-origins: http://localhost:5173,http://localhost:4173,fengmotion://app

  harness:
    # 是否接入执行引擎；关闭时 /api/harnesses 与能力声明如实返回不可用。
    enabled: true
    # dsh 可执行文件；可写绝对路径或裸命令名（裸名依赖服务进程的 PATH）。
    bin: dsh
    # 使用的 dsh profile：sdk 是官方面向进程外集成的正式入口。
    profile: sdk
    # 让 SDK 子进程带上第三方提供商的 provider 配置（路径按本机实际情况填写）。
    patch: ${FENGMOTION_DSH_PATCH:/home/lufering/.dsh/profiles/desktop/cordis.patch.yml}
    # 流式桥接插件目录：订阅 DSH 内部的 token 级帧并转写到 stderr，
    # 后端据此产出 SSE delta 帧。留空则退回「整段到达」。
    stream-plugin: ${user.dir}/dsh-plugin
    # 模型路由与模型 ID；必须与 patch 里的 provider 名称一致。
    provider: agent2api-ecs
    model: deepseek-v4.1-flash
    # 探测缓存：避免每次请求都 spawn 一个 dsh 进程。
    probe-timeout-ms: 5000
    probe-cache-ms: 60000
    # 单轮对话硬超时；超时后销毁子进程并发出错误帧，不静默结束。
    turn-timeout-ms: 180000
