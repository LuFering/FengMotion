    <title>s27 · V3 段17 · 账在哪？</title>
    <!-- 服务 SCRIPT-EP1-V3.md 第 17 段：
         「你用了那么多，账在哪？」  旁白 59.17–60.92
         镜头 59.17–61.22（= 旁白 1.75s + 段尾停顿 0.30s）= 2.05s

         ══ 逐拍 ══
         59.17–59.94  你用了那么多   → 计量器数字**跳涨**，硬停在一个整数
         59.94–60.92  账在哪？       → 一张**账单**落下来 —— 项目、数量都有，
                                       **金额栏是空的**

         ══ 手法出处 ══
         · 参考视频拆解「规律 1：凡是可以具象的词，都给实体画面」
             卡原文：「不要找比喻，要找字面。」
             → 「账」就给一张**真的账单**（不是空框、不是示意图）。

         · shotcraft 判例 `Q10`「文档类镜头的 mock 内容要出版级」
             卡原文：「观众会读清屏幕上每个字——文档/报告类镜头的 mock
             必须用产品原生排版灌满真实密度的假内容……'贴图+标语'级别的
             假文档整镜头返工。」
             → 账单做成**真的能读**：表头、日期、项目行、数量、分隔线、
               合计行，一应俱全。只有**金额栏空着**。

         · 参考视频拆解「手法 #9：数字滚动，逐位滚动，**硬停**，单位驻场」
             → 计量器跳到 2,000,000 时**硬停**，不回弹；token 单位不动。

         · ⚠️ 用户硬约束：**永远不要编造价格/费率/API 费用**
             所以账单**不设单价栏** —— 只有「项目 / 数量 / 金额」三栏，
             数量是"你用了那么多"（本片自己的用量），金额空着。
             这不是省略，这正是这一镜要说的事：**有量，没有账**。

         ══ 承接 s26 ══
         s26 末态：光停在右缘（1900），计量器在画面中心、暗着（0.34），
                   数字停在 1,500,000。
         本镜：光从右缘**移回画面中心**（同一个光源继续走，不是新开一次光），
               计量器被照亮 → 数字跳涨 → 镜头后拉给账单腾位 → 账单落下。

         ══ 出口 ══
         账单落定，金额栏空着。s28 会用一张纸把它盖住。 -->
    <script src="../gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0d10; }
      @font-face { font-family: "Noto Sans SC"; font-weight: 900;
        src: url("../assets/fonts/noto-sans-sc-900.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500;
        src: url("../assets/fonts/plex-mono-500.woff2") format("woff2"); font-display: block; }

      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #space { position: absolute; inset: 0; background: #0b0d10; }

      /* ══ 舞台：只有计量器跟着镜头后拉 ══
         ⚠️ 账单**不在 stage 里** —— 它是正常大小的一页纸，
            跟着缩会被压扁（第一版就踩了这个坑）。 */
      #stage { position: absolute; inset: 0; }

      /* ══ 计量器：承 s26，**同一造型、同一位置** ══ */
      #meter {
        position: absolute; left: 50%; top: 50%;
        width: 660px; height: 460px;
        margin-left: -330px; margin-top: -230px;
        border-radius: 22px;
        background: linear-gradient(168deg, #6d7683 0%, #4e5661 40%, #333a44 100%);
        box-shadow:
          inset 0 2px 0 rgba(255,255,255,0.40),
          inset 0 -3px 0 rgba(0,0,0,0.50),
          0 0 0 1px rgba(255,255,255,0.20),
          0 40px 90px rgba(0,0,0,0.70);
      }
      #meterPlate {
        position: absolute; left: 34px; right: 34px; top: 26px; height: 46px;
        border-radius: 8px;
        background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06));
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.28);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 18px;
        font-family: "IBM Plex Mono", monospace; font-weight: 500;
        font-size: 19px; letter-spacing: 0.24em; color: rgba(232,240,252,0.78);
      }
      #meterPlate .dot {
        width: 11px; height: 11px; border-radius: 50%;
        background: #7df0b4; box-shadow: 0 0 14px rgba(125,240,180,0.9);
      }
      #window {
        position: absolute; left: 34px; right: 34px; top: 96px; height: 190px;
        border-radius: 14px; overflow: hidden;
        background: linear-gradient(180deg, #07090c 0%, #0c1014 50%, #05070a 100%);
        box-shadow: inset 0 4px 14px rgba(0,0,0,0.92),
                    inset 0 -2px 0 rgba(255,255,255,0.06),
                    0 1px 0 rgba(255,255,255,0.10);
      }
      #tape { position: absolute; left: 0; top: 0; width: 592px; }
      #winMask {
        position: absolute; inset: 0;
        -webkit-mask-image: linear-gradient(180deg,
          rgba(0,0,0,0) 0%, #000 30%, #000 70%, rgba(0,0,0,0) 100%);
        mask-image: linear-gradient(180deg,
          rgba(0,0,0,0) 0%, #000 30%, #000 70%, rgba(0,0,0,0) 100%);
      }
      .tick {
        position: absolute; left: 0; width: 592px; height: 190px;
        display: flex; align-items: center; justify-content: center;
        font-family: "IBM Plex Mono", monospace; font-weight: 500;
        font-size: 92px; letter-spacing: 0.02em; color: #d8f0e4;
        text-shadow: 0 0 34px rgba(110,230,170,0.42);
      }
      #meterFoot {
        position: absolute; left: 34px; right: 34px; bottom: 30px; height: 62px;
        border-radius: 10px;
        background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(0,0,0,0.14));
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.24);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 22px;
      }
      #meterFoot .unit {
        font-family: "IBM Plex Mono", monospace; font-weight: 500;
        font-size: 27px; letter-spacing: 0.26em; color: rgba(232,240,252,0.88);
      }
      #meterFoot .lamp { display: flex; gap: 9px; }
      #meterFoot .lamp i {
        width: 9px; height: 26px; border-radius: 3px;
        background: rgba(255,255,255,0.20);
      }
      #meterFoot .lamp i.on { background: #7df0b4; box-shadow: 0 0 14px rgba(125,240,180,0.9); }

      /* ══ ⭐ 账单 —— 一张**真的能读**的纸（判例 Q10）══
         表头 / 日期 / 项目行 / 数量 / 分隔线 / 合计行，一应俱全。
         ⚠️ 不设「单价」栏 —— 用户硬约束：不编造费率。
            三栏：项目 / 数量 / 金额。金额栏**空着**（这正是本镜要说的事）。 */
      #bill {
        position: absolute; left: 950px; top: 120px;
        width: 690px; height: 840px;
        box-sizing: border-box;
        border-radius: 6px;
        background: linear-gradient(178deg, #fbfaf7 0%, #f3f1ea 60%, #e9e6dd 100%);
        box-shadow: 0 0 0 1px rgba(0,0,0,0.22),
                    0 50px 110px rgba(0,0,0,0.72);
        padding: 48px 52px;
        font-family: "Noto Sans SC", sans-serif; font-weight: 900;
        color: #23262b;
        transform-origin: 50% 0%;
      }
      #bill .head {
        font-size: 52px; letter-spacing: 0.24em; line-height: 1;
      }
      #bill .meta {
        margin-top: 14px;
        font-family: "IBM Plex Mono", monospace; font-weight: 500;
        font-size: 21px; letter-spacing: 0.16em; color: #6b7280;
      }
      #bill .rule {
        height: 2px; margin: 30px 0; background: #23262b; opacity: 0.82;
      }
      #bill .rule.thin { height: 1px; opacity: 0.30; margin: 22px 0; }
      #bill .cols, #bill .row {
        display: grid; grid-template-columns: 1fr 220px 190px;
        align-items: center;
      }
      #bill .cols {
        font-size: 24px; letter-spacing: 0.14em; color: #4b5563;
        padding-bottom: 14px;
      }
      #bill .cols .r, #bill .row .r { text-align: right; }
      /* ⚠️ 行高要够：「上下文缓存」六个字在 29px 下会折行，
            折行后整行塌掉。给足 86px 并禁止换行。 */
      #bill .row {
        height: 86px; font-size: 29px; letter-spacing: 0.02em;
        white-space: nowrap;
      }
      #bill .row .n {
        font-family: "IBM Plex Mono", monospace; font-weight: 500;
        font-size: 27px; text-align: right; color: #1f2937;
        white-space: nowrap;
      }
      /* ⭐ 金额栏：空着。只有一条等待被填的基准线。 */
      #bill .blank {
        display: block; height: 3px; border-radius: 2px;
        background: linear-gradient(90deg,
          rgba(35,38,43,0.10) 0%, rgba(35,38,43,0.26) 18%,
          rgba(35,38,43,0.26) 82%, rgba(35,38,43,0.10) 100%);
      }
      #bill .total {
        display: grid; grid-template-columns: 1fr 190px;
        align-items: center; margin-top: 10px;
      }
      #bill .total .lbl { font-size: 32px; letter-spacing: 0.18em; }
      #bill .total .blank { height: 4px; }

      /* ══ 光：承 s26 的同一套（两片幕布夹出的缝）══ */
      .shroud { position: absolute; top: 0; height: 1080px; width: 4000px; }
      #shroudL { left: -4000px;
        background: linear-gradient(90deg,
          #0b0d10 0px, #0b0d10 3580px, rgba(11,13,16,0) 3720px); }
      #shroudR { left: 280px;
        background: linear-gradient(90deg,
          rgba(11,13,16,0) 0px, #0b0d10 140px, #0b0d10 4000px); }
      #beam {
        position: absolute; left: 0; top: 0;
        width: 3px; height: 1080px; margin-left: -1.5px;
        background: linear-gradient(180deg,
          rgba(214,228,255,0) 0%, rgba(214,228,255,0.34) 22%,
          rgba(236,244,255,0.78) 50%, rgba(214,228,255,0.34) 78%,
          rgba(214,228,255,0) 100%);
        box-shadow: 0 0 34px 10px rgba(190,214,246,0.26);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s27" data-start="0" data-duration="2.05"
         data-width="1920" data-height="1080">
      <div id="space" class="clip" data-start="0" data-duration="2.05" data-track-index="0"></div>
      <div id="stage" class="clip" data-start="0" data-duration="2.05" data-track-index="1">
        <div id="meter">
          <div id="meterPlate"><span>TOKEN METER</span><span class="dot"></span></div>
          <div id="window"><div id="winMask"><div id="tape"></div></div></div>
          <div id="meterFoot">
            <span class="unit">token</span>
            <span class="lamp"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span>
          </div>
        </div>
      </div>
      <div id="billHost" class="clip" data-start="0" data-duration="2.05" data-track-index="2">
        <div id="bill">
          <div class="head">账单</div>
          <div class="meta">INVOICE &nbsp;·&nbsp; 2026-10-08 &nbsp;·&nbsp; NO. 0001</div>
          <div class="rule"></div>
          <div class="cols"><span>项目</span><span class="r">数量</span><span class="r">金额</span></div>
          <div class="rule thin"></div>
          <div class="row"><span>模型推理</span><span class="n">1,240,000</span><span><i class="blank" style="display:block"></i></span></div>
          <div class="row"><span>上下文缓存</span><span class="n">8,600,000</span><span><i class="blank" style="display:block"></i></span></div>
          <div class="row"><span>语音识别</span><span class="n">42,000</span><span><i class="blank" style="display:block"></i></span></div>
          <div class="row"><span>图像生成</span><span class="n">8,400</span><span><i class="blank" style="display:block"></i></span></div>
          <div class="rule"></div>
          <div class="total"><span class="lbl">合计</span><i class="blank" style="display:block"></i></div>
        </div>
      </div>
      <div class="shroud clip" id="shroudL" data-start="0" data-duration="2.05" data-track-index="3"></div>
      <div class="shroud clip" id="shroudR" data-start="0" data-duration="2.05" data-track-index="4"></div>
      <div class="clip" id="beam" data-start="0" data-duration="2.05" data-track-index="5"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ══ 滚轮数字带（与 s26 **同一套 BASE/STEP** —— 接缝上数字才连得上）══
      // s26: BASE=1,204,000 STEP=40,000，末态停 index 7 = 1,484,000
      // 本镜：index 7 → 19 = 1,484,000 → 1,964,000（跳涨，硬停）
      const tape = document.getElementById('tape');
      const N = 26, H = 190, BASE = 1204000, STEP = 40000;
      for (let i = 0; i < N; i++) {
        const t = document.createElement('div');
        t.className = 'tick';
        t.style.top = (i * H) + 'px';
        t.textContent = (BASE + i * STEP).toLocaleString('en-US');
        t.setAttribute('data-layout-ignore', '');
        tape.appendChild(t);
      }
      tape.style.height = (N * H) + 'px';

      // ══ 初始态：**承 s26 末态**（不重画、不复位）══
      // s26 结束：光在 1900（右缘）、计量器 opacity 0.34、
      //           数字带 y = -1330（= index 7，显示 1,484,000）
      const XLIGHT = 1900, XCENTER = 960;
      gsap.set(['#shroudL', '#shroudR', '#beam'], { x: XLIGHT });
      gsap.set('#tape', { y: -7 * H });         // 1,484,000（s26 的落点）
      gsap.set('#meter', { opacity: 0.34 });
      gsap.set('#stage', { scale: 1, x: 0, y: 0, transformOrigin: '50% 50%' });
      gsap.set('#bill', { opacity: 0, y: -520 });

      // ══ 时间表（2.05s）—— 逐拍对齐旁白 ════════════════════════
      //  0.00–0.50  光从右缘移回画面中心（同一光源继续走）—— 计量器被照亮
      //  0.00–0.44  「你用了那么多」：数字**跳涨**到 2,000,000（硬停）
      //  0.50–1.10  镜头**后拉**，给右侧腾出账单的位置
      //  1.00–1.70  「账在哪？」：**账单落下来**（有重量）
      //  1.70–2.05  落定 —— 金额栏空着
      const T_LIGHT = 0.00;
      const T_JUMP  = 0.00;
      const T_PULL  = 0.50;
      const T_BILL  = 1.00;

      // ① 光移回中心（承 s26 的光，linear —— 卡里的命门：匀速）
      tl.fromTo(['#shroudL', '#shroudR', '#beam'],
        { x: XLIGHT }, { x: XCENTER, duration: 0.62, ease: 'power2.inOut' }, T_LIGHT);

      // ② 计量器亮起
      tl.to('#meter', { opacity: 1, duration: 0.38, ease: 'power2.out' }, T_LIGHT + 0.14);

      // ③ 数字跳涨（index 7 → 19，硬停无回弹 —— 手法 #9）
      tl.fromTo('#tape', { y: -7 * H },
        { y: -19 * H, duration: 0.44, ease: 'power3.out' }, T_JUMP + 0.22);

      // ④ 镜头后拉（给账单腾位）
      //    计量器屏幕位置 = 960×0.62 − 150 ≈ 445；账单落在 950..1640。
      tl.to('#stage', { scale: 0.62, x: -150, y: -50, duration: 0.62, ease: 'power2.inOut' }, T_PULL);

      // ⑤ ⭐ 光**散开**：账单落在光的右边界之外，光必须让开才看得见它
      //    （右幕右移 = 缝变宽；左幕左移 = 亮区整体扩到右侧）
      tl.to('#shroudR', { x: XCENTER + 620, duration: 0.62, ease: 'power2.inOut' }, T_PULL);
      tl.to('#shroudL', { x: XCENTER - 40, duration: 0.62, ease: 'power2.inOut' }, T_PULL);
      // 光柱在散开时退场（光散成一片，就不再是一条线）
      tl.to('#beam', { opacity: 0, duration: 0.46, ease: 'power2.out' }, T_PULL);

      // ⑥ 账单落下（有重量 —— 一张纸拍在桌上）
      tl.to('#bill', { opacity: 1, y: 0, duration: 0.56, ease: 'power3.out' }, T_BILL);
      tl.to('#bill', { y: -10, duration: 0.16, ease: 'power2.out' }, T_BILL + 0.56);
      tl.to('#bill', { y: 0, duration: 0.20, ease: 'power2.inOut' }, T_BILL + 0.72);

      window.__timelines['s27'] = tl;
    </script>
