<!doctype html>
<html lang="zh" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>镜 17 · 一头算力 一头生产力</title>
    <script src="../gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      @font-face { font-family: "Noto Sans SC"; font-weight: 900;
        src: url("../assets/fonts/noto-sans-sc-900.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500;
        src: url("../assets/fonts/plex-mono-500.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "Big Shoulders Display"; font-weight: 800;
        src: url("../assets/fonts/big-shoulders-800.woff2") format("woff2"); font-display: block; }

      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #space {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 126% 84% at 50% 46%,
          #1b2028 0%, #14181e 44%, #0d1014 76%, #08090c 100%);
      }
      #stage { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 48%; }
      #camera { position: absolute; inset: 0; transform-style: preserve-3d; }

      /* ── 三点循环：算力 ⇄ Token ⇄ 生产力 ────────────────────────
         判例明确：**不要静态环形箭头图，要有真实的力在拉**。
         做法：三个节点用有张力的曲线相连（不是直箭头），
         线上的"张力包"沿曲线往复 —— 读作互相牵引。 */
      #loop { position: absolute; inset: 0; }
      #loopSvg { position: absolute; inset: 0; overflow: visible; }
      /* ⚠ 必须显式给 stroke —— SVG path 默认 stroke:none，不写就永远看不见 */
      #loopSvg path {
        fill: none;
        stroke: rgba(214,228,255,0.42);
        stroke-width: 3;
        stroke-linecap: round;
      }
      #p2 { stroke: rgba(255,214,160,0.40); }
      #p3 { stroke: rgba(180,215,255,0.40); }

      .node {
        position: absolute; left: 0; top: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        border-radius: 22px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 26px 60px rgba(0,0,0,0.66);
        will-change: transform, opacity;
      }
      .node .t {
        font-family: "Noto Sans SC", sans-serif; font-weight: 900;
        font-size: 40px; color: #f2f3f5; white-space: nowrap;
      }
      .node .c {
        font-family: "IBM Plex Mono", monospace; font-weight: 500;
        font-size: 15px; letter-spacing: 0.26em; color: #9aa3b2;
        margin-top: 10px; white-space: nowrap;
      }
      /* 中心：Token —— 它是一切的中转 */
      #nToken {
        width: 300px; height: 300px; margin-left: -150px; margin-top: -150px;
        border-radius: 50%;
        background: radial-gradient(circle at 42% 36%, #3a4250 0%, #222833 52%, #12161c 100%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 32px 80px rgba(0,0,0,0.72);
      }
      #nToken .t {
        font-family: "Big Shoulders Display", sans-serif; font-weight: 800;
        font-size: 86px; letter-spacing: 0.01em;
        background: linear-gradient(180deg, #ffffff 0%, #f2efe9 40%, #cfcac1 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }
      /* 左：算力 / 右：生产力 */
      #nCompute {
        width: 400px; height: 220px; margin-left: -200px; margin-top: -110px;
        background: linear-gradient(158deg, #4a5568 0%, #2b3340 56%, #1a1f27 100%);
      }
      #nProduce {
        width: 400px; height: 220px; margin-left: -200px; margin-top: -110px;
        background: linear-gradient(158deg, #6b5f4a 0%, #3f392c 56%, #25221a 100%);
      }

      /* 张力包：沿路径往复的小块 */
      .tension {
        position: absolute; left: 0; top: 0; width: 30px; height: 30px;
        border-radius: 50%;
        background: radial-gradient(circle at 44% 40%, #ffffff 0%, #cfd8e6 48%, #8a93a2 100%);
        box-shadow: 0 0 20px rgba(214,228,255,0.6);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s17" data-start="0" data-duration="7.6"
         data-width="1920" data-height="1080">
      <div id="space" class="clip" data-start="0" data-duration="7.6" data-track-index="0"></div>
      <div id="stage" class="clip" data-start="0" data-duration="7.6" data-track-index="1">
        <div id="camera">
          <div id="loop">
            <svg id="loopSvg" viewBox="0 0 1920 1080" width="1920" height="1080">
              <path id="p1" d="" />
              <path id="p2" d="" />
              <path id="p3" d="" />
            </svg>
          </div>
          <div class="node" id="nCompute">
            <div class="t">算力</div><div class="c">COMPUTE</div>
          </div>
          <div class="node" id="nProduce">
            <div class="t">生产力</div><div class="c">PRODUCTIVITY</div>
          </div>
          <div class="node" id="nToken"><div class="t">Token</div></div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ── 三点位置 ────────────────────────────────────────────────
      // 三点构成等边三角，循环才读得出来
      const CX = 960, CY = 540;
      const R = 330;
      const P = {
        token:   { x: CX,                 y: CY + 210 },   // 下中
        compute: { x: CX - R,             y: CY - 130 },   // 左上
        produce: { x: CX + R,             y: CY - 130 },   // 右上
      };
      gsap.set('#nToken',   { x: P.token.x,   y: P.token.y });
      gsap.set('#nCompute', { x: P.compute.x, y: P.compute.y });
      gsap.set('#nProduce', { x: P.produce.x, y: P.produce.y });

      // ── 有张力的曲线（不是直线箭头）──────────────────────────────
      // 每条边用二次贝塞尔，控制点朝外侧鼓 —— 三相之间形成"张力"
      function edge(a, b, bulge, id) {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const dx = b.x - a.x, dy = b.y - a.y;
        const L = Math.hypot(dx, dy) || 1;
        // 法线方向
        const nx = -dy / L, ny = dx / L;
        const cx = mx + nx * bulge, cy = my + ny * bulge;
        const d = `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`;
        document.getElementById(id).setAttribute('d', d);
        return { id, a, b, cx, cy };
      }
      const EDGES = [
        edge(P.compute, P.produce, -110, 'p1'),   // 算力 → 生产力（上弧）
        edge(P.produce, P.token,   -120, 'p2'),   // 生产力 → Token（右弧）
        edge(P.token,   P.compute, -120, 'p3'),   // Token → 算力（左弧）
      ];
      EDGES.forEach((e) => {
        const el = document.getElementById(e.id);
        const len = el.getTotalLength();
        gsap.set(el, { strokeDasharray: len, strokeDashoffset: len, opacity: 0 });
        e.el = el; e.len = len;
      });

      // ── 时间表（30fps）──────────────────────────────────────────
      //  0.00–0.60  承 s16：两侧元素收束，循环的空间显形
      //  0.60–1.50  Token 先落定（它是中心）
      //  1.50–2.30  算力 / 生产力 两个节点就位（一头一尾）
      //  2.30–3.60  三条张力曲线依次画出（三相连成闭环）
      //  3.60–4.30  张力包开始沿路径往复 —— "有真实的力在拉"
      //  4.30–7.60  缓慢绕行（orbit），让三个节点的纵深关系被看见
      const T_TOKEN = 0.60;
      const T_SIDES = 1.50;
      const T_EDGE  = 2.30;
      const T_PULL  = 3.60;
      const T_ORBIT = 4.30;

      // ① Token
      tl.fromTo('#nToken', { opacity: 0, scale: 0.72 },
        { opacity: 1, scale: 1, duration: 0.70, ease: 'back.out(1.5)' }, T_TOKEN);

      // ② 两侧节点
      tl.fromTo('#nCompute', { opacity: 0, x: P.compute.x - 160, y: P.compute.y + 40, scale: 0.86 },
        { opacity: 1, x: P.compute.x, y: P.compute.y, scale: 1, duration: 0.65, ease: 'power3.out' }, T_SIDES);
      tl.fromTo('#nProduce', { opacity: 0, x: P.produce.x + 160, y: P.produce.y + 40, scale: 0.86 },
        { opacity: 1, x: P.produce.x, y: P.produce.y, scale: 1, duration: 0.65, ease: 'power3.out' }, T_SIDES + 0.14);

      // ③ 曲线依次画出
      EDGES.forEach((e, i) => {
        tl.to(e.el, { opacity: 1, duration: 0.10, ease: 'none' }, T_EDGE + i * 0.24);
        tl.to(e.el, { strokeDashoffset: 0, duration: 0.86, ease: 'power2.inOut' }, T_EDGE + i * 0.24);
      });

      // ④ 张力包沿路径往复（确定性：按路径取点算位置）
      const tensions = [];
      EDGES.forEach((e, i) => {
        for (let k = 0; k < 2; k++) {
          const el = document.createElement('div');
          el.className = 'tension';
          el.setAttribute('data-layout-ignore', '');
          document.getElementById('loop').appendChild(el);
          gsap.set(el, { opacity: 0 });
          tensions.push({ el, edge: e, phase: (i * 0.17 + k * 0.5) % 1 });
        }
      });
      tensions.forEach((t) => {
        const st = { p: t.phase };
        tl.to(t.el, { opacity: 1, duration: 0.20, ease: 'none' }, T_PULL);
        tl.to(st, {
          p: t.phase + 2.4, duration: 2.4, ease: 'none', repeat: 1,
          onUpdate: () => {
            const f = st.p % 1;
            const pt = t.edge.el.getPointAtLength(t.edge.len * f);
            gsap.set(t.el, { x: pt.x, y: pt.y });
            // 往复感：过中点时最亮
            gsap.set(t.el, { opacity: 0.45 + 0.55 * Math.sin(Math.PI * f) });
          },
        }, T_PULL);
      });

      // ⑤ 缓慢绕行 —— 看见三个节点的纵深关系
      tl.to('#camera', { rotationY: 9, x: -70, duration: 2.60, ease: 'sine.inOut' }, T_ORBIT);
      tl.to('#camera', { rotationY: 0,  x: 0,   duration: 1.20, ease: 'sine.inOut' }, T_ORBIT + 2.70);

      window.__timelines['s17'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
