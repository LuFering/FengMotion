    <!-- 服务 SCRIPT-EP1-V3.md 第 18 段：
         「它被藏起来了。」  旁白 61.22–62.38
         镜头 61.22–62.68（= 旁白 1.17s + 段尾停顿 0.30s）= 1.46s

         ══ 手法出处 ══
         · 参考视频拆解「规律 1：凡是可以具象的词，都给实体画面」
             卡原文：「不要找比喻，要找字面。」
             ⚠️ 卡里同时警告：「不要画'藏'的比喻（锁、箱子、手）」——
                所以这一镜不画锁、不画箱子、不画手，
                就是**一张纸盖下来**。这是字面，不是比喻。

         · shotcraft `bubble-swarm-takeover`（洗白层语法）
             卡原文：「洗白层压在页面与气泡之间 —— 页面先被洗掉细节。」
             → 这里把"洗白层"换成"一张盖纸"：纸落在账单上，
               账单先被盖掉，纸才成为画面主角。

         ══ 这一镜的语义 ══
         s27 摆出了一张真账单（数量齐全、金额空着）。
         本镜：**一张纸从上方盖下来**，把整张账单压住。
         旁白说「它被藏起来了」—— 画面演的就是"盖住"这个动作本身。

         ⚠️ 命门：纸盖住之后，**底下的账单还得隐约看得见**。
            完全盖死 =「本来就没有」（正好说反）；
            盖住但透出轮廓 =「有，但被藏了」。 ✅

         ══ 承接 s27 ══
         s27 末态：计量器在后拉位置（scale 0.62 / x −150），
                   账单落在 950..1640，光已散开成一片。
         本镜起手就是那一帧 —— 不重画、不复位。

         ══ 出口 ══
         纸压住账单后，纸上**什么都没写**（空白）。
         s29 会在这片空白上，让「免费」标签一枚枚落下来。 -->

            盖住但透出底下的轮廓 =「有，但被藏了」。 ✅
         所以纸用 0.90 的白 + 一层极淡的纱感 ——
         底下的字迹变成"隐约可见的凹痕"，而不是消失。 */
      #sheet {
        position: absolute; left: 950px; top: 120px;
        width: 690px; height: 840px;
        box-sizing: border-box;
        border-radius: 6px;

        backdrop-filter: blur(1.2px);
        box-shadow: 0 0 0 1px rgba(0,0,0,0.16),
                    0 26px 60px rgba(0,0,0,0.55);
        transform-origin: 50% 0%;

      }

      #sheetEdge {
        position: absolute; left: 950px; width: 690px; height: 2px;

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ══ 滚轮数字带（与 s26/s27 同一套 BASE/STEP）══
      const tape = document.getElementById('tape');
      const N = 26, H = 190, BASE = 1204000, STEP = 40000;
      for (let i = 0; i < N; i++) {
        const t = document.createElement('div');
        t.className = 'tick';
        t.style.top = (i * H) + 'px';
        t.textContent = (BASE + i * STEP).toLocaleString('en-US');
        t.setAttribute('data-layout-ignore', '');
        tape.appendChild(t);
      }
      tape.style.height = (N * H) + 'px';

      // ══ 初始态：**承 s27 末态**（不重画、不复位）══
      // s27 结束：计量器在后拉位置，账单在位，光已散开。
      gsap.set('#stage', { scale: 0.62, x: -150, y: -50, transformOrigin: '50% 50%' });
      gsap.set('#tape', { y: -19 * H });          // 1,964,000（s27 的落点）
      gsap.set('#shroudL', { x: 920 });           // 承 s27 的光散开位置
      gsap.set('#shroudR', { x: 1580 });
      gsap.set('#sheetEdge', { opacity: 0, y: 0 });

      // ══ 时间表（1.46s）════════════════════════════════════
      //  0.00–0.20  承 s27 末帧（账单摆着，金额栏空着）
      //  0.20–1.10  纸**从上往下**落，盖住账单（linear —— 卡里"幕布"的匀速感）
      //  1.10–1.46  纸落定；底下的账单还隐约透出来
      const T_FALL   = 0.20;
      const T_FALL_D = 0.90;

      // ① 纸落下：scaleY 0→1，从上往下铺
      tl.fromTo('#sheet', { scaleY: 0 }, { scaleY: 1, duration: T_FALL_D, ease: 'none' }, T_FALL);

      // ② 纸的前沿亮边走一遍（标出"正在盖到这里"）
      tl.fromTo('#sheetEdge', { opacity: 0, y: 0 },
        { opacity: 1, duration: 0.16, ease: 'power2.out' }, T_FALL);
      tl.to('#sheetEdge', { y: 840, duration: T_FALL_D, ease: 'none' }, T_FALL);
      tl.to('#sheetEdge', { opacity: 0, duration: 0.20, ease: 'power2.in' },
        T_FALL + T_FALL_D - 0.10);

      // ③ 计量器留在暗里（承 s27 的余光，不参与这一镜）
      tl.to('#stage', { opacity: 0.40, duration: T_FALL_D, ease: 'power1.inOut' }, T_FALL);

      window.__timelines['s28'] = tl;
    </script>
